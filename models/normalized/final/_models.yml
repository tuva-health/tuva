### Normalized Claim Input Layer
##    Final

  - name: normalized__provider_attribution
    description: |-
      This model creates the normalized provider attribution input used by Claims Preprocessing Attribution. It casts externally supplied payer-attributed and custom-attributed member-month fields from stg_input_layer__provider_attribution to package data types when provider attribution is enabled. When provider attribution is disabled, it returns an empty relation with the same columns so downstream attribution outputs can still build with null attribution fields.
    config:
      schema: *schema
      materialized: table
      tags:
        - normalized_input
        - normalized_layer
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - member_id
              - year_month
              - payer
              - "{{ quote_column('plan') }}"
              - data_source
    columns:
      - name: person_id
        description: Globally unique identifier for the attributed person, cast to string from stg_input_layer__provider_attribution.
      - name: member_id
        description: Member identifier for the attribution assignment, cast to string from stg_input_layer__provider_attribution.
      - name: year_month
        description: Calendar month of the attribution assignment, cast to string from stg_input_layer__provider_attribution.
      - name: payer
        description: Payer associated with the attribution assignment, cast to string from stg_input_layer__provider_attribution.
      - name: plan
        description: Plan associated with the attribution assignment, cast to string from stg_input_layer__provider_attribution.
      - name: payer_attributed_provider
        description: Externally supplied provider identifier assigned by the payer or health plan.
      - name: payer_attributed_provider_practice
        description: Externally supplied practice assigned by the payer or health plan.
      - name: payer_attributed_provider_organization
        description: Externally supplied organization assigned by the payer or health plan.
      - name: payer_attributed_provider_lob
        description: Externally supplied line of business assigned by the payer or health plan.
      - name: custom_attributed_provider
        description: User-defined provider identifier assigned by a custom attribution methodology.
      - name: custom_attributed_provider_practice
        description: User-defined practice assigned by a custom attribution methodology.
      - name: custom_attributed_provider_organization
        description: User-defined organization assigned by a custom attribution methodology.
      - name: custom_attributed_provider_lob
        description: User-defined line of business assigned by a custom attribution methodology.
      - name: file_name
        description: Source file name cast to string from stg_input_layer__provider_attribution.
      - name: ingest_datetime
        description: Source file ingest timestamp cast to timestamp from stg_input_layer__provider_attribution.
      - name: tuva_last_run
        description: Timestamp value from the tuva_last_run dbt variable for the current dbt invocation.
      - name: data_source
