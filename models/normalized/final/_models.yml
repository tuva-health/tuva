  - name: normalized__pharmacy_claim
    description: |
      The pharmacy claim table contains information on prescription drugs that 
      were filled and billed to the insurer.
    config:
      schema: *schema
      materialized: table
      tags:
        - normalized_input
        - normalized_layer
    columns:
      - name: claim_id
        description: Unique identifier for each claim.
      - name: claim_line_number
        description: Indicates the line number for the particular line of the claim.
        data_type: integer
      - name: person_id
        description: Unique identifier for each patient in the dataset.
      - name: member_id
        description: >
          Identifier that links a patient to a particular insurance product or  health plan. A patient can have more than one member_id because they  can have more than one insurance product/plan.
      - name: payer
        description: Name of the payer
      - name: plan
        description: Name of the plan
      - name: prescribing_provider_npi
        description: >
          NPI for the provider that wrote the prescription (e.g. priamry care  physician).
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: "**Note: this terminology set is too large to be loaded as a seed and is instead loaded from public cloud storage for supported adapters."
      - name: dispensing_provider_npi
        description: >
          NPI for the provider that dispensed the prescription (e.g. pharmacy).
        config:
          meta:
            terminology: https://thetuvaproject.com/terminology/provider
            terminology_note: "**Note: this terminology set is too large to be loaded as a seed and is instead loaded from public cloud storage for supported adapters."
      - name: dispensing_date
        description: Date the prescription was filled.
      - name: ndc_code
        description: National drug code on the claim.
        config:
          meta:
            terminology: https://www.fda.gov/drugs/drug-approvals-and-databases/national-drug-code-directory
      - name: quantity
        description: Number of doses.
        data_type: integer
      - name: days_supply
        description: Number of days supply.
        data_type: integer
      - name: refills
        description: Number of refills for the prescription.
        data_type: integer
      - name: paid_date
        description: Date the claim was paid.
      - name: paid_amount
        description: Amount paid by the health insurer for the claim.
      - name: allowed_amount
        description: >
          Contractual amount allowed to be paid by the payer + patient.
      - name: coinsurance_amount
        description: The total coinsurance charged on the claim by the provider.
      - name: copayment_amount
        description: The total copayment charged on the claim by the provider.
      - name: deductible_amount
        description: The total amount charged on the claim by the provider.
      - name: data_source
        description: >
          User-configured field that indicates the data source (e.g. typically  named after the payer and state "BCBS Tennessee").
      - name: tuva_last_run
        description: >
          The last time the data was refreshed.  Generated by  `dbt_utils.pretty_time` as the local time of the `dbt run`  environment.  Timezone is configurable via the `tuva_last_run` var.
      - name: file_name
        description: 'The file name of the source file.'
      - name: file_date
        description: 'The date associated with the claims file, typically reflecting the reporting period of the claims data.'
      - name: ingest_datetime
        description: 'The date and time the source file was ingested into the data warehouse or landed in cloud storage.'

