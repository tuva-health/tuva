version: 2

models:
  - name: data_quality__input_layer_catalog
    description: One row per enabled Input Layer column with table type, expected data type, primary-key metadata, and column order.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: input_layer_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - input_table_name
              - input_column_name
    columns:
      - name: input_table_name
        tests:
          - not_null
      - name: input_model_name
      - name: input_column_name
        tests:
          - not_null
      - name: input_table_type
        tests:
          - accepted_values:
              arguments:
                values:
                  - Claims
                  - Clinical
                  - Other
      - name: expected_data_type
      - name: expected_type_family
      - name: is_primary_key
      - name: column_order

  - name: data_quality__data_source_catalog
    description: One row per populated data source and source type, derived from structural metadata and enabled Input Layer tables.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: data_source_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: data_source_type
      - name: input_table_count
      - name: row_count

  - name: data_quality__logical_test_catalog
    description: One row per enabled logical data quality test with flag-table metadata, severity, check category, affected grain, keys, and investigation SQL.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - test_name
    columns:
      - name: test_name
        tests:
          - not_null
      - name: display_name
        tests:
          - not_null
      - name: description
        tests:
          - not_null
      - name: input_model_name
      - name: input_table_name
      - name: flag_model_name
      - name: flag_table_name
      - name: flag_column_name
      - name: grain
      - name: key_columns
      - name: test_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing
                  - invalid
                  - temporal
                  - referential
                  - consistency
      - name: check_category
      - name: severity
        tests:
          - not_null
          - accepted_values:
              arguments:
                quote: false
                values:
                  - 1
                  - 2
                  - 3
      - name: default_severity
        tests:
          - not_null
          - accepted_values:
              arguments:
                quote: false
                values:
                  - 1
                  - 2
                  - 3
      - name: investigation_sql

  - name: data_quality__logical_test_input_columns
    description: One row per logical data quality test and related input field used for domain-to-test matching.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_input_columns
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: test_name
        tests:
          - not_null
      - name: input_table_name
        tests:
          - not_null
      - name: input_column_name
        tests:
          - not_null

  - name: data_quality__domain_catalog
    description: Domain reporting hierarchy for source data quality rollups.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: domain_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
    columns:
      - name: domain_group_key
        tests:
          - not_null
      - name: domain_group_name
      - name: component_key
        tests:
          - not_null
      - name: component_name
      - name: display_order

  - name: data_quality__domain_input_requirements
    description: Maps source data quality reporting components to required Input Layer tables and optional columns.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: domain_input_requirements
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
              - input_table_name
              - input_column_name
              - requirement_source
    columns:
      - name: domain_group_key
        tests:
          - not_null
      - name: component_key
        tests:
          - not_null
      - name: input_table_name
        tests:
          - not_null
      - name: input_column_name
      - name: requirement_level
      - name: requirement_source

  - name: data_quality__logical_test_results
    description: One row per data source, input table, and logical test with tested, passed, failed, and not-applicable counts.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: display_name
      - name: description
      - name: test_type
      - name: severity
      - name: total_row_count
      - name: tested_count
      - name: failed_count
      - name: passed_count
      - name: not_applicable_count

  - name: data_quality__structural_test_results
    description: Normalized structural data quality results at data source, input table, and structural test grain.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: structural_test_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: severity
      - name: display_name
      - name: description
      - name: test_type
      - name: tested_count
      - name: failed_count

  - name: data_quality__component_test_quality_results
    description: Component-level drilldown at data source, domain group, component, input table, and test grain.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_test_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: domain_group_name
      - name: component_key
      - name: component_name
      - name: input_table_name
      - name: test_name
      - name: severity
      - name: test_source
      - name: display_name
      - name: description
      - name: test_type
      - name: tested_count
      - name: failed_count

  - name: data_quality__component_table_quality_results
    description: Component-level drilldown at data source, domain group, component, and input table grain.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_table_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: component_key
      - name: input_table_name
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__component_quality_results
    description: Component-level source data quality rollups with pass percentage, severity percentages, counts, and status.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: component_key
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__source_quality_overview
    description: Highest-level source data quality rollup by data source and domain group.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: source_quality_overview
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: domain_group_name
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__logical_failure_keys
    description: Optional key-only drilldown table for logical data quality failures. Disabled by default and enabled with enable_data_quality_failure_keys.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_failure_keys
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: display_name
      - name: description
      - name: test_type
      - name: severity
      - name: key_columns
      - name: key_values
