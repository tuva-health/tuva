version: 2

models:
  - name: data_quality__input_layer_catalog
    description: One row per enabled Input Layer column with table type, expected data type, primary-key metadata, and column order.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: input_layer_catalog
      tags:
        - data_quality
        - dq_logical
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - input_table_name
              - input_column_name
    columns:
      - name: input_table_name
        tests:
          - not_null
      - name: input_model_name
      - name: input_column_name
        tests:
          - not_null
      - name: input_table_type
        tests:
          - accepted_values:
              arguments:
                values:
                  - Claims
                  - Clinical
                  - Other
      - name: expected_data_type
      - name: expected_type_family
      - name: is_primary_key
      - name: column_order

  - name: data_quality__data_source_catalog
    description: One row per populated data source and source type, derived from structural metadata and enabled Input Layer tables.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: data_source_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: data_source_type
      - name: input_table_count
      - name: row_count

  - name: data_quality__logical_test_catalog
    description: Stable public catalog with one row per enabled Logical Data Quality test and the metadata required to interpret its results.
    config:
      access: public
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_catalog
      tags:
        - data_quality
        - dq_logical
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - test_name
    columns:
      - name: test_name
        description: Stable identifier for the Logical Data Quality test.
        data_type: varchar
        tests:
          - not_null
      - name: display_name
        description: Human-readable test name.
        data_type: varchar
        tests:
          - not_null
      - name: description
        description: Complete description of the condition the test evaluates.
        data_type: varchar
        tests:
          - not_null
      - name: input_model_name
        description: dbt model name of the Input Layer Wrapper evaluated by the test.
        data_type: varchar
      - name: input_table_name
        description: Public Input Layer Model name evaluated by the test.
        data_type: varchar
      - name: flag_model_name
        description: Internal dbt model that materializes the test's row-level flag.
        data_type: varchar
      - name: flag_table_name
        description: Internal Warehouse Table or View containing the test's row-level flag.
        data_type: varchar
      - name: flag_column_name
        description: Column in the internal flag table containing the tri-state test result.
        data_type: varchar
      - name: grain
        description: Business grain at which the flag model evaluates the test.
        data_type: varchar
      - name: key_columns
        description: Comma-separated Input Layer columns that identify a row at the declared grain, in canonical order.
        data_type: varchar
      - name: test_type
        description: Logical test classification used to group related checks.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing
                  - invalid
                  - temporal
                  - referential
                  - consistency
      - name: severity
        description: Integer severity assigned to a failure, where 1 is most severe and 3 is least severe.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                quote: false

  - name: data_quality__logical_test_input_columns
    description: Stable public mapping with one row per enabled Logical Data Quality test and affected Input Layer column.
    config:
      access: public
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_input_columns
      tags:
        - data_quality
        - dq_logical
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - test_name
              - input_table_name
              - input_column_name
    columns:
      - name: test_name
        description: Stable identifier for the Logical Data Quality test.
        data_type: varchar
        tests:
          - not_null
      - name: input_table_name
        description: Public Input Layer Model containing the affected column.
        data_type: varchar
        tests:
          - not_null
      - name: input_column_name
        description: Input Layer column whose value or relationship the test evaluates.
        data_type: varchar
        tests:
          - not_null

  - name: data_quality__domain_catalog
    description: Domain reporting hierarchy for source data quality rollups.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: domain_catalog
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
    columns:
      - name: domain_group_key
        tests:
          - not_null
      - name: domain_group_name
      - name: component_key
        tests:
          - not_null
      - name: component_name
      - name: display_order

  - name: data_quality__domain_input_requirements
    description: Maps source data quality reporting components to required Input Layer tables and optional columns.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: domain_input_requirements
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
              - input_table_name
              - input_column_name
              - requirement_source
    columns:
      - name: domain_group_key
        tests:
          - not_null
      - name: component_key
        tests:
          - not_null
      - name: input_table_name
        tests:
          - not_null
      - name: input_column_name
      - name: requirement_level
      - name: requirement_source

  - name: data_quality__logical_test_results
    description: One row per data source, input table, and logical test with tested, passed, failed, and not-applicable counts.
    config:
      access: public
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_test_results
      tags:
        - data_quality
        - dq_logical
        - dq_rollup
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_source
              - input_table_name
              - test_name
    columns:
      - name: data_source
        description: Source identifier evaluated independently by the test.
        data_type: varchar
      - name: input_table_name
        description: Public Input Layer Model evaluated by the test.
        data_type: varchar
        tests:
          - not_null
      - name: test_name
        description: Stable identifier for the Logical Data Quality test.
        data_type: varchar
        tests:
          - not_null
      - name: display_name
        description: Human-readable test name.
        data_type: varchar
        tests:
          - not_null
      - name: description
        description: Complete description of the condition the test evaluates.
        data_type: varchar
        tests:
          - not_null
      - name: grain
        description: Business grain at which the test is evaluated.
        data_type: varchar
      - name: flag_table_name
        description: Internal flag table aggregated to produce this result.
        data_type: varchar
      - name: flag_column_name
        description: Tri-state flag column aggregated to produce this result.
        data_type: varchar
      - name: test_type
        description: Logical test classification used to group related checks.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing
                  - invalid
                  - temporal
                  - referential
                  - consistency
      - name: severity
        description: Integer severity assigned to a failure, where 1 is most severe and 3 is least severe.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                quote: false
      - name: total_row_count
        description: Number of flag-model rows for the data source before applicability is considered.
        data_type: bigint
        tests:
          - not_null
      - name: tested_count
        description: Number of rows for which the test returned either pass or fail.
        data_type: bigint
        tests:
          - not_null
      - name: failed_count
        description: Number of applicable rows for which the test returned fail.
        data_type: bigint
        tests:
          - not_null
      - name: passed_count
        description: Number of applicable rows for which the test returned pass.
        data_type: bigint
        tests:
          - not_null
      - name: not_applicable_count
        description: Number of rows for which the test returned null because the test did not apply.
        data_type: bigint
        tests:
          - not_null

  - name: data_quality__structural_test_results
    description: Four normalized structural readiness results for each data source and enabled Input Layer Model.
    config:
      access: public
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: structural_test_results
      tags:
        - data_quality
        - dq_rollup
        - dq_structural
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_source
              - input_table_name
              - test_name
    columns:
      - name: data_source
        description: Source identifier evaluated by the normalized structural check. Null retains the structural matrix's null-source semantics.
      - name: input_table_name
        description: Connector-owned Input Layer Model evaluated by the check.
        tests:
          - not_null
      - name: test_name
        description: Stable identifier for one of the four structural checks.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - structural__columns_exist
                  - structural__data_types_correct
                  - structural__table_populated
                  - structural__primary_key_correct
      - name: severity
        description: Integer 1 for an active structural failure and null for pass or not evaluated.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 1
                quote: false
      - name: display_name
      - name: description
      - name: grain
      - name: test_type
      - name: check_category
      - name: total_row_count
        description: Number of Input Layer records represented by this Model and data-source result.
      - name: tested_count
        description: One when the check was evaluated and zero when it was not evaluated.
      - name: failed_count
        description: One when the check failed and zero otherwise.
      - name: passed_count
        description: One when the check passed and zero otherwise.
      - name: not_evaluated_count
        description: One when a prerequisite prevented evaluation and zero otherwise.

  - name: data_quality__component_test_quality_results
    description: Output Data Quality drilldown for relevant logical failures at data source, domain group, component, input table, and test grain. Structural findings remain in Input Data Quality and are intentionally excluded.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_test_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: domain_group_name
      - name: component_key
      - name: component_name
      - name: input_table_name
      - name: test_name
      - name: severity
      - name: test_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - logical
      - name: display_name
      - name: description
      - name: test_type
      - name: tested_count
      - name: failed_count

  - name: data_quality__component_table_quality_results
    description: Output Data Quality rollup of relevant logical failures at data source, domain group, component, and input table grain.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_table_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: component_key
      - name: input_table_name
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__component_quality_results
    description: Output Data Quality component rollups of relevant logical failures with pass percentage, severity percentages, counts, and status.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: component_quality_results
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: component_key
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__source_quality_overview
    description: Highest-level Output Data Quality rollup of relevant logical failures by data source and domain group.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: source_quality_overview
      tags:
        - data_quality
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: domain_group_name
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__logical_failure_keys
    description: Optional stable public key-only drilldown with one row per failing Logical Data Quality flag row. Disabled by default and enabled with enable_data_quality_failure_keys.
    config:
      access: public
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: logical_failure_keys
      tags:
        - data_quality
        - dq_logical
        - dq_rollup
      materialized: table
    columns:
      - name: data_source
        description: Source identifier of the failing flag row.
        data_type: varchar
      - name: input_table_name
        description: Public Input Layer Model evaluated by the test.
        data_type: varchar
      - name: test_name
        description: Stable identifier for the failed Logical Data Quality test; join to logical_test_catalog for descriptive metadata.
        data_type: varchar
      - name: grain
        description: Business grain at which the failing row was evaluated.
        data_type: varchar
      - name: key_columns
        description: Comma-separated key column names in the same order used by key_values.
        data_type: varchar
      - name: key_values_format
        description: Encoding version for key_values. The current value is percent_escaped_v1.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values:
                  - percent_escaped_v1
      - name: key_values
        description: >-
          Reversible ordered tuple encoded as percent_escaped_v1. Each null component is N. Each non-null component is V followed by its string value after percent signs are replaced with %25 and vertical bars are replaced with %7C; an empty string is V. Components follow key_columns order and are joined with a literal vertical bar. Decode %7C before %25.
        data_type: varchar
