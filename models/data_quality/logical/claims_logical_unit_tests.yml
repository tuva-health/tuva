  - name: test_medical_claim_contract_values_and_eligibility_identity
    description: >
      Verifies exact lowercase medical claim and code-system contracts, exact
      professional applicability, and member-month eligibility matching with
      complete identity, date precedence, month overlap, and data-source
      isolation.
    model: data_quality__medical_claim_line_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          with cases as (
              select 'exact_professional' as claim_id, 'professional' as claim_type, 'person' as person_id, 'member' as member_id, 'payer' as payer, 'plan' as plan_value, cast('2024-01-01' as date) as claim_line_start_date, cast('2024-02-01' as date) as claim_start_date, cast('2024-03-01' as date) as admission_date, 'source_a' as data_source, '111' as bill_type_code, cast(null as {{ string_type }}) as drg_code_type, cast(null as {{ string_type }}) as diagnosis_code_type, cast(null as {{ string_type }}) as procedure_code_type, cast(null as {{ string_type }}) as diagnosis_code_1, cast(null as {{ string_type }}) as procedure_code_1
              union all
              select 'uppercase_professional', 'PROFESSIONAL', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-02-01' as date), cast('2024-03-01' as date), 'source_a', '111', null, null, null, null, null
              union all
              select 'exact_undetermined', 'undetermined', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_a', null, null, null, null, null, null
              union all
