              union all
              select 'exact_code_types', 'institutional', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_a', '111', 'ms-drg', 'icd-10-cm', 'icd-10-pcs', 'D001', 'P001'
              union all
              select 'source_b_match', 'undetermined', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_b', null, null, null, null, null, null
              union all
              select 'source_c_no_match', 'undetermined', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_c', null, null, null, null, null, null
              union all
              select 'wrong_member', 'undetermined', 'person', 'other_member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_a', null, null, null, null, null, null
              union all
              select 'wrong_payer', 'undetermined', 'person', 'member', 'other_payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_a', null, null, null, null, null, null
              union all
              select 'wrong_plan', 'undetermined', 'person', 'member', 'payer', 'other_plan', cast('2024-01-01' as date), cast('2024-01-01' as date), cast(null as date), 'source_a', null, null, null, null, null, null
              union all
              select 'claim_start_fallback', 'undetermined', 'person', 'member', 'payer', 'plan', cast(null as date), cast('2024-02-01' as date), cast('2024-03-01' as date), 'source_a', null, null, null, null, null, null
              union all
              select 'admission_fallback', 'undetermined', 'person', 'member', 'payer', 'plan', cast(null as date), cast(null as date), cast('2024-03-01' as date), 'source_a', null, null, null, null, null, null
              union all
