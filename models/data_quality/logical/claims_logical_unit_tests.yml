version: 2

unit_tests:
  - name: test_eligibility_overlap_and_optional_flags_are_tristate
    description: >
      Verifies that overlapping spans are evaluated within the complete
      coverage identity, while adjacent, gapped, and different-plan spans do
      not overlap and an incomplete span is not applicable.
    model: data_quality__eligibility_span_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select 'overlap' as person_id, 'member' as member_id, cast('2024-01-01' as date) as enrollment_start_date, cast('2024-01-31' as date) as enrollment_end_date, 'payer' as payer, 'plan_a' as {{ plan_identifier }}, 'male' as sex, 'White' as race, cast('1980-01-01' as date) as birth_date, cast(null as date) as death_date, 0 as death_flag, 'commercial' as payer_type, 'source' as data_source
          union all
          select 'overlap', 'member', cast('2024-01-15' as date), cast('2024-02-15' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'adjacent', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'adjacent', 'member', cast('2024-02-01' as date), cast('2024-02-29' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'different_plan', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'different_plan', 'member', cast('2024-01-15' as date), cast('2024-02-15' as date), 'payer', 'plan_b', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'gapped', 'member', cast('2024-01-01' as date), cast('2024-01-10' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'gapped', 'member', cast('2024-01-20' as date), cast('2024-01-31' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'incomplete', 'member', cast(null as date), cast('2024-01-31' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source'
          union all
          select 'cross_source', 'member', cast('2024-01-02' as date), cast('2024-01-31' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source_a'
          union all
          select 'cross_source', 'member', cast('2024-01-16' as date), cast('2024-02-15' as date), 'payer', 'plan_a', 'male', 'White', cast('1980-01-01' as date), cast(null as date), 0, 'commercial', 'source_b'
      - input: ref('terminology__race')
        format: sql
        rows: |
          select 'White' as description
      - input: ref('terminology__payer_type')
        format: sql
        rows: |
          select 'commercial' as payer_type
    expect:
      rows:
        - person_id: overlap
          enrollment_start_date: '2024-01-01'
          plan: plan_a
          overlapping_enrollment_spans: 1
        - person_id: overlap
          enrollment_start_date: '2024-01-15'
          plan: plan_a
          overlapping_enrollment_spans: 1
        - person_id: adjacent
          enrollment_start_date: '2024-01-01'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: adjacent
          enrollment_start_date: '2024-02-01'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: different_plan
          enrollment_start_date: '2024-01-01'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: different_plan
          enrollment_start_date: '2024-01-15'
          plan: plan_b
          overlapping_enrollment_spans: 0
        - person_id: gapped
          enrollment_start_date: '2024-01-01'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: gapped
          enrollment_start_date: '2024-01-20'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: incomplete
          enrollment_start_date: null
          plan: plan_a
          overlapping_enrollment_spans: null
        - person_id: cross_source
          enrollment_start_date: '2024-01-02'
          plan: plan_a
          overlapping_enrollment_spans: 0
        - person_id: cross_source
          enrollment_start_date: '2024-01-16'
          plan: plan_a
          overlapping_enrollment_spans: 0

  - name: test_eligibility_boolean_death_flags_are_portable
    description: >
      Verifies that true and false Boolean values remain valid across adapters
      whose string representation is either true/false or 1/0, and that only a
      true value makes the death-date consistency check applicable.
    model: data_quality__eligibility_span_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          {% set true_boolean = 'cast(1 as bit)' if target.type in ['fabric', 'sqlserver'] else 'cast(true as boolean)' %}
          {% set false_boolean = 'cast(0 as bit)' if target.type in ['fabric', 'sqlserver'] else 'cast(false as boolean)' %}
          select 'true_missing_date' as person_id, 'member' as member_id, cast('2024-01-01' as date) as enrollment_start_date, cast('2024-01-31' as date) as enrollment_end_date, 'payer' as payer, 'plan' as {{ plan_identifier }}, 'unknown' as sex, 'Unknown' as race, cast('1980-01-01' as date) as birth_date, cast(null as date) as death_date, {{ true_boolean }} as death_flag, 'commercial' as payer_type, 'source' as data_source
          union all
          select 'true_with_date', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan', 'unknown', 'Unknown', cast('1980-01-01' as date), cast('2024-01-15' as date), {{ true_boolean }}, 'commercial', 'source'
          union all
          select 'false_without_date', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan', 'unknown', 'Unknown', cast('1980-01-01' as date), cast(null as date), {{ false_boolean }}, 'commercial', 'source'
          union all
          select 'null_flag', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan', 'unknown', 'Unknown', cast('1980-01-01' as date), cast(null as date), cast(null as {{ 'bit' if target.type in ['fabric', 'sqlserver'] else 'boolean' }}), 'commercial', 'source'
      - input: ref('terminology__race')
        format: sql
        rows: |
          select 'Unknown' as description
      - input: ref('terminology__payer_type')
        format: sql
        rows: |
          select 'commercial' as payer_type
    expect:
      rows:
        - person_id: true_missing_date
          death_flag_invalid: 0
          death_flag_without_death_date: 1
        - person_id: true_with_date
          death_flag_invalid: 0
          death_flag_without_death_date: 0
        - person_id: false_without_date
          death_flag_invalid: 0
          death_flag_without_death_date: null
        - person_id: null_flag
          death_flag_invalid: null
          death_flag_without_death_date: null

  - name: test_eligibility_sex_values_require_exact_lowercase
    description: >
      Verifies that the eligibility sex contract accepts the exact lowercase
      values and rejects a letter-case variant that downstream models preserve.
    model: data_quality__eligibility_span_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          {% set false_boolean = 'cast(0 as bit)' if target.type in ['fabric', 'sqlserver'] else 'cast(false as boolean)' %}
          select 'lowercase' as person_id, 'member' as member_id, cast('2024-01-01' as date) as enrollment_start_date, cast('2024-01-31' as date) as enrollment_end_date, 'payer' as payer, 'plan' as {{ plan_identifier }}, 'male' as sex, 'White' as race, cast('1980-01-01' as date) as birth_date, cast(null as date) as death_date, {{ false_boolean }} as death_flag, 'commercial' as payer_type, 'source' as data_source
          union all
          select 'case_variant', 'member', cast('2024-01-01' as date), cast('2024-01-31' as date), 'payer', 'plan', 'Male', 'White', cast('1980-01-01' as date), cast(null as date), {{ false_boolean }}, 'commercial', 'source'
      - input: ref('terminology__race')
        format: sql
        rows: |
          select 'White' as description
      - input: ref('terminology__payer_type')
        format: sql
        rows: |
          select 'commercial' as payer_type
    expect:
      rows:
        - person_id: lowercase
          sex_invalid: 0
        - person_id: case_variant
          sex_invalid: 1

  - name: test_eligibility_person_sex_consistency_preserves_case
    description: >
      Verifies that distinct letter-case variants remain distinct values in a
      person-level consistency result within one data_source.
    model: data_quality__eligibility_person_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          select 'case_variant' as person_id, 'male' as sex, 'White' as race, cast('1980-01-01' as date) as birth_date, 'source' as data_source
          union all
          select 'case_variant', 'Male', 'White', cast('1980-01-01' as date), 'source'
    expect:
      rows:
        - person_id: case_variant
          multiple_sexes_per_person: 1
          multiple_races_per_person: 0
          multiple_birth_dates_per_person: 0

  - name: test_eligibility_person_consistency_flags_are_tristate
    description: >
      Verifies that person-level consistency is not applicable for one
      populated value or an all-null population, passes for repeated values,
      and fails for conflicting values.
    model: data_quality__eligibility_person_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          select 'single' as person_id, 'male' as sex, 'White' as race, cast('1980-01-01' as date) as birth_date, 'source' as data_source
          union all
          select 'same', 'female', 'Asian', cast('1981-01-01' as date), 'source'
          union all
          select 'same', 'female', 'Asian', cast('1981-01-01' as date), 'source'
          union all
          select 'conflict', 'male', 'White', cast('1982-01-01' as date), 'source'
          union all
          select 'conflict', 'female', 'Black or African American', cast('1983-01-01' as date), 'source'
          union all
          select 'all_null', null, null, cast(null as date), 'source'
          union all
          select 'all_null', null, null, cast(null as date), 'source'
          union all
          select 'cross_source', 'male', 'White', cast('1984-01-01' as date), 'source_a'
          union all
          select 'cross_source', 'female', 'Asian', cast('1985-01-01' as date), 'source_b'
    expect:
      rows:
        - person_id: single
          multiple_sexes_per_person: null
          multiple_races_per_person: null
          multiple_birth_dates_per_person: null
        - person_id: same
          multiple_sexes_per_person: 0
          multiple_races_per_person: 0
          multiple_birth_dates_per_person: 0
        - person_id: conflict
          multiple_sexes_per_person: 1
          multiple_races_per_person: 1
          multiple_birth_dates_per_person: 1
        - person_id: all_null
          multiple_sexes_per_person: null
          multiple_races_per_person: null
          multiple_birth_dates_per_person: null
        - person_id: cross_source
          multiple_sexes_per_person: null
          multiple_races_per_person: null
          multiple_birth_dates_per_person: null
        - person_id: cross_source
          multiple_sexes_per_person: null
          multiple_races_per_person: null
          multiple_birth_dates_per_person: null

  - name: test_pharmacy_claim_line_new_flags_are_tristate
    description: >
      Verifies missing, non-positive, negative, valid, and not-applicable
      behavior for the new pharmacy claim-line checks.
    model: data_quality__pharmacy_claim_line_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__pharmacy_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          with row_ids as (
              select 'missing_values' as claim_id, 1 as claim_line_number
              union all
              select 'invalid_values', 0
              union all
              select 'valid_values', 1
          )
          select
                row_ids.claim_id
              , row_ids.claim_line_number
              , 'person' as person_id
              , 'member' as member_id
              , 'payer' as payer
              , 'plan' as {{ plan_identifier }}
              , cast('2024-01-01' as date) as dispensing_date
              , cast('2024-01-15' as date) as paid_date
              , 'valid_npi' as prescribing_provider_npi
              , 'valid_npi' as dispensing_provider_npi
              , 'valid_ndc' as ndc_code
              , case when row_ids.claim_id = 'missing_values' then null when row_ids.claim_id = 'invalid_values' then 0 else 30 end as quantity
              , case when row_ids.claim_id = 'missing_values' then null when row_ids.claim_id = 'invalid_values' then -1 else 30 end as days_supply
              , case when row_ids.claim_id = 'missing_values' then null when row_ids.claim_id = 'invalid_values' then -1 else 0 end as refills
              , 1 as paid_amount
              , 2 as allowed_amount
              , 'source' as data_source
          from row_ids
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select 'person' as person_id, 'member' as member_id, 'payer' as payer, 'plan' as {{ plan_identifier }}, cast('1999-01-01' as date) as enrollment_start_date, cast('2030-12-31' as date) as enrollment_end_date, 'source' as data_source
      - input: ref('provider_data__provider')
        format: sql
        rows: |
          select 'valid_npi' as npi
      - input: ref('core__stg_coderx_packages')
        format: sql
        rows: |
          select 'valid_ndc' as ndc11, null as ndc
    expect:
      rows:
        - claim_id: missing_values
          claim_line_number_not_positive: 0
          quantity_null: 1
          quantity_not_positive: null
          days_supply_null: 1
          days_supply_not_positive: null
          refills_lt_zero: null
        - claim_id: invalid_values
          claim_line_number_not_positive: 1
          quantity_null: 0
          quantity_not_positive: 1
          days_supply_null: 0
          days_supply_not_positive: 1
          refills_lt_zero: 1
        - claim_id: valid_values
          claim_line_number_not_positive: 0
          quantity_null: 0
          quantity_not_positive: 0
          days_supply_null: 0
          days_supply_not_positive: 0
          refills_lt_zero: 0

  - name: test_pharmacy_claim_eligibility_match_uses_member_month_identity
    description: >
      Verifies that pharmacy eligibility matching uses paid_date month and the
      complete person, member, payer, plan, and data-source identity without
      borrowing an eligibility row from another source.
    model: data_quality__pharmacy_claim_line_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__pharmacy_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          with cases as (
              select 'paid_month_match' as claim_id, 'person' as person_id, 'member' as member_id, 'payer' as payer, 'plan' as plan_value, cast('2024-01-01' as date) as paid_date, cast('2023-12-15' as date) as dispensing_date, 'source_a' as data_source
              union all
              select 'dispensing_match_paid_miss', 'person', 'member', 'payer', 'plan', cast('2024-02-01' as date), cast('2024-01-15' as date), 'source_a'
              union all
              select 'source_b_match', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), 'source_b'
              union all
              select 'source_c_no_match', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), 'source_c'
              union all
              select 'wrong_member', 'person', 'other_member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), 'source_a'
              union all
              select 'wrong_payer', 'person', 'member', 'other_payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), 'source_a'
              union all
              select 'wrong_plan', 'person', 'member', 'payer', 'other_plan', cast('2024-01-01' as date), cast('2024-01-01' as date), 'source_a'
              union all
              select 'paid_date_missing', 'person', 'member', 'payer', 'plan', cast(null as date), cast('2024-01-01' as date), 'source_a'
              union all
              select 'literal_null_sentinel', 'person', 'member', 'payer', 'plan', cast('2024-01-01' as date), cast('2024-01-01' as date), '__dq_null__'
          )
          select
                cases.claim_id
              , 1 as claim_line_number
              , cases.person_id
              , cases.member_id
              , cases.payer
              , cases.plan_value as {{ plan_identifier }}
              , cases.dispensing_date
              , cases.paid_date
              , 'valid_npi' as prescribing_provider_npi
              , 'valid_npi' as dispensing_provider_npi
              , 'valid_ndc' as ndc_code
              , 30 as quantity
              , 30 as days_supply
              , 0 as refills
              , 1 as paid_amount
              , 2 as allowed_amount
              , cases.data_source
          from cases
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select 'person' as person_id, 'member' as member_id, 'payer' as payer, 'plan' as {{ plan_identifier }}, cast('2024-01-31' as date) as enrollment_start_date, cast('2024-01-31' as date) as enrollment_end_date, 'source_a' as data_source
          union all
          select 'person', 'member', 'payer', 'plan', cast('2024-01-31' as date), cast('2024-01-31' as date), 'source_b'
          union all
          select 'person', 'member', 'payer', 'plan', cast('2024-01-31' as date), cast('2024-01-31' as date), null
      - input: ref('provider_data__provider')
        format: sql
        rows: |
          select 'valid_npi' as npi
      - input: ref('core__stg_coderx_packages')
        format: sql
        rows: |
          select 'valid_ndc' as ndc11, null as ndc
    expect:
      rows:
        - claim_id: paid_month_match
          no_matching_eligibility_span: 0
        - claim_id: dispensing_match_paid_miss
          no_matching_eligibility_span: 1
        - claim_id: source_b_match
          no_matching_eligibility_span: 0
        - claim_id: source_c_no_match
          no_matching_eligibility_span: 1
        - claim_id: wrong_member
          no_matching_eligibility_span: 1
        - claim_id: wrong_payer
          no_matching_eligibility_span: 1
        - claim_id: wrong_plan
          no_matching_eligibility_span: 1
        - claim_id: paid_date_missing
          no_matching_eligibility_span: null
        - claim_id: literal_null_sentinel
          no_matching_eligibility_span: 1

  - name: test_medical_claim_line_new_flags_are_tristate
    description: >
      Verifies fail, pass, and not-applicable behavior for medical claim-line
      number, paid-date range, and paid-date sequencing checks.
    model: data_quality__medical_claim_line_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          with row_ids as (
              select 'missing_paid_date' as claim_id, 1 as claim_line_number
              union all
              select 'invalid_values', 0
              union all
              select 'valid_values', 1
              union all
              select 'before_claim_end', 1
              union all
              select 'same_as_claim_end', 1
              union all
              select 'missing_claim_end', 1
          )
          select
                row_ids.claim_id
              , row_ids.claim_line_number
              , 'undetermined' as claim_type
              , 'person' as person_id
              , 'member' as member_id
              , 'payer' as payer
              , 'plan' as {{ plan_identifier }}
              , cast('2024-01-01' as date) as claim_start_date
              , case
                  when row_ids.claim_id = 'before_claim_end' then cast('2024-02-01' as date)
                  when row_ids.claim_id = 'same_as_claim_end' then cast('2024-01-15' as date)
                  when row_ids.claim_id = 'missing_claim_end' then cast(null as date)
                  else cast('2024-01-01' as date)
                end as claim_end_date
              , cast('2024-01-01' as date) as claim_line_start_date
              , cast('2024-01-01' as date) as claim_line_end_date
              , cast(null as date) as admission_date
              , cast(null as date) as discharge_date
              , null as admit_source_code
              , null as admit_type_code
              , null as discharge_disposition_code
              , null as place_of_service_code
              , null as bill_type_code
              , null as revenue_center_code
              , null as hcpcs_code
              , null as rendering_npi
              , null as billing_npi
              , null as facility_npi
              , null as drg_code_type
              , null as drg_code
              , null as diagnosis_code_type
              , null as procedure_code_type
              , case
                  when row_ids.claim_id = 'missing_paid_date' then cast(null as date)
                  when row_ids.claim_id = 'invalid_values' then cast('1999-12-31' as date)
                  else cast('2024-01-15' as date)
                end as paid_date
              , 1 as paid_amount
              , 2 as allowed_amount
              {% for index in range(1, 26) %}
              , null as diagnosis_code_{{ index }}
              {% endfor %}
              {% for index in range(1, 26) %}
              , null as procedure_code_{{ index }}
              {% endfor %}
              , 'source' as data_source
          from row_ids
      - input: ref('input_layer__eligibility')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          select 'person' as person_id, 'member' as member_id, 'payer' as payer, 'plan' as {{ plan_identifier }}, cast('2000-01-01' as date) as enrollment_start_date, cast('2030-12-31' as date) as enrollment_end_date, 'source' as data_source
      - input: ref('terminology__admit_source')
        format: sql
        rows: |
          select '__unused__' as admit_source_code
      - input: ref('terminology__admit_type')
        format: sql
        rows: |
