  - name: test_pharmacy_claim_aggregate_flags_are_tristate
    description: >
      Verifies single-line, repeated, conflicting, and prerequisite-free
      person-identity consistency at pharmacy-claim grain.
    model: data_quality__pharmacy_claim_claim_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__pharmacy_claim')
        format: sql
        rows: |
          select 'single' as claim_id, 'person_a' as person_id, cast('2024-01-01' as date) as dispensing_date, cast('2024-01-15' as date) as paid_date, 'source' as data_source
          union all
          select 'same', 'person_a', cast('2024-01-01' as date), cast('2024-01-15' as date), 'source'
          union all
          select 'same', 'person_a', cast('2024-01-02' as date), cast('2024-01-16' as date), 'source'
          union all
          select 'conflict', 'person_a', cast('2024-01-01' as date), cast('2024-01-15' as date), 'source'
          union all
          select 'conflict', 'person_b', cast('2024-01-02' as date), cast('2024-01-16' as date), 'source'
          union all
          select 'missing_match', 'person_missing', cast('2024-01-01' as date), cast('2024-01-15' as date), 'source'
          union all
          select 'no_prerequisites', null, cast(null as date), cast(null as date), 'source'
          union all
          select 'cross_source', 'person_a', cast('2024-01-01' as date), cast('2024-01-15' as date), 'source_a'
          union all
          select 'cross_source', 'person_b', cast('2024-01-01' as date), cast('2024-01-15' as date), 'source_b'
    expect:
      rows:
        - claim_id: single
          multiple_person_ids_per_claim: null
        - claim_id: same
          multiple_person_ids_per_claim: 0
        - claim_id: conflict
          multiple_person_ids_per_claim: 1
        - claim_id: missing_match
          multiple_person_ids_per_claim: null
        - claim_id: no_prerequisites
          multiple_person_ids_per_claim: null
        - claim_id: cross_source
          multiple_person_ids_per_claim: null
        - claim_id: cross_source
          multiple_person_ids_per_claim: null
