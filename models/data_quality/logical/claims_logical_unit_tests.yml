  - name: test_medical_claim_header_consistency_flags_are_tristate
    description: >
      Verifies every new header-consistency flag, including fail behavior for
      conflicting or mixed null/populated values, pass behavior for repeated
      values, and not-applicable behavior for single-line and all-null groups.
    model: data_quality__medical_claim_claim_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('claims_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__medical_claim')
        format: sql
        rows: |
          {% set plan_identifier = '[plan]' if target.type in ['fabric', 'sqlserver'] else '`plan`' if target.type == 'bigquery' else 'plan' %}
          with row_ids as (
              select 'single_line' as claim_id, 1 as claim_line_number, 'source' as data_source
              union all
              select 'same_values', 1, 'source'
              union all
              select 'same_values', 2, 'source'
              union all
              select 'mixed_values', 1, 'source'
              union all
              select 'mixed_values', 2, 'source'
              union all
              select 'all_null', 1, 'source'
              union all
              select 'all_null', 2, 'source'
              union all
              select 'case_conflict', 1, 'source'
              union all
              select 'case_conflict', 2, 'source'
              union all
              select 'uppercase_institutional', 1, 'source'
              union all
              select 'uppercase_institutional', 2, 'source'
              union all
              select 'cross_source', 1, 'source_a'
              union all
              select 'cross_source', 1, 'source_b'
          )
          select
                row_ids.claim_id
              , row_ids.claim_line_number
              , case when row_ids.claim_id = 'uppercase_institutional' then 'INSTITUTIONAL' else 'institutional' end as claim_type
              , 'person' as person_id
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then null when row_ids.claim_id = 'cross_source' and row_ids.data_source = 'source_b' then 'member_b' else 'member_a' end as member_id
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then 'payer_b' else 'payer_a' end as payer
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then 'plan_b' else 'plan_a' end as {{ plan_identifier }}
              , case when row_ids.claim_id = 'all_null' then cast(null as date) when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then cast('2024-01-02' as date) else cast('2024-01-01' as date) end as claim_start_date
              , case when row_ids.claim_id = 'all_null' then cast(null as date) when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then cast(null as date) else cast('2024-01-31' as date) end as claim_end_date
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then 'billing_b' else 'billing_a' end as billing_npi
              , 'facility' as facility_npi
              , cast('2024-01-01' as date) as admission_date
              , cast('2024-01-31' as date) as discharge_date
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then null else '1' end as admit_source_code
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then '2' else '1' end as admit_type_code
              , case when row_ids.claim_id = 'all_null' then null when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then '02' else '01' end as discharge_disposition_code
              , case when row_ids.claim_id = 'uppercase_institutional' and row_ids.claim_line_number = 2 then '112' else '111' end as bill_type_code
              , case when row_ids.claim_id = 'uppercase_institutional' and row_ids.claim_line_number = 2 then '002' else '001' end as drg_code
              , case
                  when row_ids.claim_id = 'all_null' then null
                  when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then null
                  when row_ids.claim_id = 'case_conflict' and row_ids.claim_line_number = 2 then 'MS-DRG'
                  else 'ms-drg'
                end as drg_code_type
              , case
                  when row_ids.claim_id = 'all_null' then null
                  when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then null
                  when row_ids.claim_id = 'case_conflict' and row_ids.claim_line_number = 2 then 'ICD-10-CM'
                  else 'icd-10-cm'
                end as diagnosis_code_type
              , case
                  when row_ids.claim_id = 'all_null' then null
                  when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then 'icd-9-pcs'
                  when row_ids.claim_id = 'case_conflict' and row_ids.claim_line_number = 2 then 'ICD-10-PCS'
                  else 'icd-10-pcs'
                end as procedure_code_type
              {% for index in range(1, 26) %}
              , {% if index == 1 %}
                    case
                      when row_ids.claim_id = 'all_null' then null
                      when row_ids.claim_id = 'same_values' and row_ids.claim_line_number = 1 then 'D00.1'
                      else 'D001'
                    end
                {% elif index == 25 %}
                    case
                      when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 1 then 'Z001'
                      when row_ids.claim_id = 'mixed_values' and row_ids.claim_line_number = 2 then 'Z002'
                      else null
                    end
                {% else %}null{% endif %} as diagnosis_code_{{ index }}
              {% endfor %}
              {% for index in range(1, 26) %}
              , {% if index == 1 %}'P001'{% else %}null{% endif %} as procedure_code_{{ index }}
              {% endfor %}
              , row_ids.data_source
          from row_ids
    expect:
      rows:
        - claim_id: single_line
          member_id_has_multiple_values_per_claim: null
