version: 2

models:
  - name: data_quality__medical_claim_line_flags
    description: One row per medical claim line per data source with native-grain keys and tri-state logical flags, where 1 means fail, 0 means pass, and null means not applicable.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality
        {% else %}data_quality{%- endif -%}
      alias: medical_claim_line_flags
      tags:
        - data_quality
      materialized: table
    columns:
      - name: claim_id
      - name: claim_line_number
      - name: data_source

