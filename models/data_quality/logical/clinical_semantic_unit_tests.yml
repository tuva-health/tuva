            , null as admit_source_code, null as admit_type_code, null as discharge_disposition_code
            , null as facility_npi, null as primary_diagnosis_code_type, null as primary_diagnosis_code
            , null as drg_code_type, null as drg_code, 'source' as data_source
          union all
          select 'both_absent', 'p1', 'a1', null, cast(null as date), cast(null as date)
            , null, null, null, null, null, null, null, null, 'source'
          union all
          select 'identity_null', null, 'a1', null, cast(null as date), cast(null as date)
            , null, null, null, null, null, null, null, null, 'source'
          union all
          select 'code_only', 'p1', 'a1', null, cast(null as date), cast(null as date)
            , null, null, null, null, null, 'D1', null, '001', 'source'
          union all
          select 'type_only', 'p1', 'a1', null, cast(null as date), cast(null as date)
            , null, null, null, null, 'icd-10-cm', null, 'ms-drg', null, 'source'
          union all
          select 'paired', 'p1', 'a1', 'office visit', cast(null as date), cast(null as date)
            , null, null, null, null, 'icd-10-cm', 'D1', 'ms-drg', '001', 'source'
          union all
          select 'cross_source_pair', 'p1', 'a1', null, cast(null as date), cast(null as date)
            , null, null, null, null, null, null, null, null, 'source_b'
          union all
          select 'case_variant', 'p1', 'a1', 'Office Visit', cast(null as date), cast(null as date)
            , null, null, null, null, 'ICD-10-CM', 'D1', 'MS-DRG', '001', 'source'
          ) as fixture_rows
      - input: ref('input_layer__patient')
        format: sql
        rows: |
          select 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
          union all select 'p1', 'a2', 'source'
