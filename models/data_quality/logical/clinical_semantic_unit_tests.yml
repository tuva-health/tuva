  - name: test_immunization_identity_code_status_and_date_flags
    description: >
      Verifies source-scoped immunization identity, code pairing and lookup,
      status semantics, and occurrence date flags.
    model: data_quality__immunization_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('clinical_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__immunization')
        format: sql
        rows: |
          select fixture_rows.*, cast(null as timestamp) as ingest_datetime
          from (
          select 'valid' as immunization_id, 'p1' as person_id, 'a1' as patient_id, 'e1' as encounter_id
            , 'cvx' as source_code_type, '1' as source_code, 'not-done' as status, 'reason1' as status_reason
            , cast('2020-01-01' as date) as occurrence_date, 'source' as data_source
          union all
          select 'optional_null', 'p1', 'a1', null, null, null, 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'type_missing', 'p1', 'a1', null, null, '1', 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'code_missing', 'p1', 'a1', null, 'cvx', null, 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'cvx_invalid', 'p1', 'a1', null, 'cvx', 'bad_cvx', 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'status_fail', 'p1', 'a1', null, 'cvx', '1', 'bad_status', 'bad_reason', cast(null as date), 'source'
          union all
          select 'completed_reason', 'p1', 'a1', null, 'cvx', '1', 'completed', 'reason1', cast('2020-01-01' as date), 'source'
          union all
          select 'pair_fail', 'p1', 'b2', null, 'cvx', '1', 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'encounter_fail', 'p1', 'a1', 'e2', 'cvx', '1', 'completed', null, cast('2020-01-01' as date), 'source'
          union all
          select 'cross_source_patient_pair', 'cross_person_patient', 'cross_patient_patient', null
            , 'cvx', '1', 'completed', null, cast('2020-01-01' as date), 'source_b'
          union all
          select 'cross_source_encounter_pair', 'cross_person_encounter', 'cross_patient_encounter', 'cross_encounter'
            , 'cvx', '1', 'completed', null, cast('2020-01-01' as date), 'source_b'
          ) as fixture_rows
      - input: ref('input_layer__patient')
        format: sql
        rows: |
          select 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
