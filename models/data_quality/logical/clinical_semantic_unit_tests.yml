version: 2

unit_tests:
  - name: test_appointment_identity_semantic_and_fanout_flags
    description: >
      Verifies source-scoped patient and encounter identity, appointment
      semantics, tri-state applicability, and one output row when a person has
      multiple patient IDs.
    model: data_quality__appointment_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('clinical_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__appointment')
        format: sql
        rows: |
          select 'valid' as appointment_id, 'p1' as person_id, 'a1' as patient_id, 'e1' as encounter_id
            , cast('2020-01-01' as date) as start_datetime
            , cast('2020-01-02' as date) as end_datetime
            , 30 as duration, 'office' as type_code, 'booked' as status_code, 'source' as data_source
          union all
          select 'pair_fail', 'p1', 'b2', null
            , cast('2020-01-01' as date), cast('2020-01-02' as date)
            , 30, 'office', 'booked', 'source'
          union all
          select 'encounter_fail', 'p1', 'a1', 'e2'
            , cast('2020-01-01' as date), cast('2020-01-02' as date)
            , 30, 'office', 'booked', 'source'
          union all
          select 'semantic_fail', 'p1', 'a1', 'e1'
            , cast('2020-01-02' as date), cast('2020-01-01' as date)
            , -1, 'bad_type', 'bad_status', 'source'
          union all
          select 'optional_null', 'p1', 'a1', null
            , cast('2020-01-01' as date), cast(null as date)
            , cast(null as integer), null, null, 'source'
          union all
          select 'identity_null', null, 'a1', null
            , cast('2020-01-01' as date), cast(null as date)
            , cast(null as integer), null, null, 'source'
          union all
          select 'cross_source_patient_pair', 'cross_person_patient', 'cross_patient_patient', null
            , cast('2020-01-01' as date), cast('2020-01-02' as date)
            , 30, 'office', 'booked', 'source_b'
          union all
          select 'cross_source_encounter_pair', 'cross_person_encounter', 'cross_patient_encounter', 'cross_encounter'
            , cast('2020-01-01' as date), cast('2020-01-02' as date)
            , 30, 'office', 'booked', 'source_b'
      - input: ref('input_layer__patient')
        format: sql
        rows: |
          select 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
          union all select 'p1', 'a2', 'source'
          union all select 'p2', 'b2', 'source'
          union all select 'cross_person_patient', 'cross_patient_patient', 'source'
          union all select 'cross_person_patient', 'same_source_other_patient', 'source_b'
          union all select 'same_source_other_person', 'cross_patient_patient', 'source_b'
          union all select 'cross_person_encounter', 'cross_patient_encounter', 'source_b'
      - input: ref('input_layer__encounter')
        format: sql
        rows: |
          select 'e1' as encounter_id, 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
          union all select 'e2', 'p2', 'b2', 'source'
          union all select 'cross_encounter', 'cross_person_encounter', 'cross_patient_encounter', 'source'
          union all select 'cross_encounter', 'same_source_other_person', 'same_source_other_patient', 'source_b'
      - input: ref('terminology__appointment_type')
        format: sql
        rows: |
          select 'office' as code
      - input: ref('terminology__appointment_status')
        format: sql
        rows: |
          select 'booked' as code
    expect:
      rows:
        - appointment_id: valid
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 0
          end_datetime_before_start_datetime: 0
          duration_negative: 0
          type_code_invalid: 0
          status_code_invalid: 0
        - appointment_id: pair_fail
          person_patient_pair_not_in_patient: 1
          encounter_person_patient_pair_not_in_encounter: null
          end_datetime_before_start_datetime: 0
          duration_negative: 0
          type_code_invalid: 0
          status_code_invalid: 0
        - appointment_id: encounter_fail
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 1
          end_datetime_before_start_datetime: 0
          duration_negative: 0
          type_code_invalid: 0
          status_code_invalid: 0
        - appointment_id: semantic_fail
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 0
          end_datetime_before_start_datetime: 1
          duration_negative: 1
          type_code_invalid: 1
          status_code_invalid: 1
        - appointment_id: optional_null
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: null
          end_datetime_before_start_datetime: null
          duration_negative: null
          type_code_invalid: null
          status_code_invalid: null
        - appointment_id: identity_null
          person_patient_pair_not_in_patient: null
          encounter_person_patient_pair_not_in_encounter: null
          end_datetime_before_start_datetime: null
          duration_negative: null
          type_code_invalid: null
          status_code_invalid: null
        - appointment_id: cross_source_patient_pair
          person_patient_pair_not_in_patient: 1
          encounter_person_patient_pair_not_in_encounter: null
          end_datetime_before_start_datetime: 0
          duration_negative: 0
          type_code_invalid: 0
          status_code_invalid: 0
        - appointment_id: cross_source_encounter_pair
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 1
          end_datetime_before_start_datetime: 0
          duration_negative: 0
          type_code_invalid: 0
          status_code_invalid: 0

  - name: test_appointment_date_range_flags_are_tristate
    description: >
      Verifies the inclusive 2000-01-01 lower boundary, a representative
      in-range timestamp, a clearly future timestamp, and null applicability.
      The shared macro contract verifies the dynamic current-date-plus-12-month
      upper boundary exactly.
    model: data_quality__appointment_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('clinical_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__appointment')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select 'at_minimum' as appointment_id, 'person' as person_id, 'patient' as patient_id, cast(null as {{ string_type }}) as encounter_id
            , cast('2000-01-01' as timestamp) as start_datetime, cast('2000-01-01' as timestamp) as end_datetime
            , 30 as duration, 'office' as type_code, 'booked' as status_code, 'source' as data_source
          union all
          select 'before_minimum', 'person', 'patient', null
            , cast('1999-12-31' as timestamp), cast('1999-12-31' as timestamp)
            , 30, 'office', 'booked', 'source'
          union all
          select 'within_range', 'person', 'patient', null
            , cast('2024-12-31' as timestamp), cast('2024-12-31' as timestamp)
            , 30, 'office', 'booked', 'source'
          union all
          select 'too_late', 'person', 'patient', null
            , cast('2999-01-01' as timestamp), cast('2999-01-01' as timestamp)
            , 30, 'office', 'booked', 'source'
          union all
          select 'missing', 'person', 'patient', null
            , cast(null as timestamp), cast(null as timestamp)
            , 30, 'office', 'booked', 'source'
      - input: ref('input_layer__patient')
        format: sql
        rows: |
          select 'person' as person_id, 'patient' as patient_id, 'source' as data_source
      - input: ref('input_layer__encounter')
        format: sql
        rows: |
          select '__unused__' as encounter_id, 'person' as person_id, 'patient' as patient_id, 'source' as data_source
      - input: ref('terminology__appointment_type')
        format: sql
        rows: |
          select 'office' as code
      - input: ref('terminology__appointment_status')
        format: sql
        rows: |
          select 'booked' as code
    expect:
      rows:
        - appointment_id: at_minimum
          start_datetime_out_of_reasonable_range: 0
          end_datetime_out_of_reasonable_range: 0
        - appointment_id: before_minimum
          start_datetime_out_of_reasonable_range: 1
          end_datetime_out_of_reasonable_range: 1
        - appointment_id: within_range
          start_datetime_out_of_reasonable_range: 0
          end_datetime_out_of_reasonable_range: 0
        - appointment_id: too_late
          start_datetime_out_of_reasonable_range: 1
          end_datetime_out_of_reasonable_range: 1
        - appointment_id: missing
          start_datetime_out_of_reasonable_range: null
          end_datetime_out_of_reasonable_range: null

  - name: test_condition_identity_and_date_flags
    description: >
      Verifies source-scoped condition identity, temporal ordering, range
      failures, pass, and not-applicable results.
    model: data_quality__condition_flags
    config:
      enabled: "{{ (var('data_quality_enabled', false) and var('clinical_enabled', false)) | as_bool }}"
    given:
      - input: ref('input_layer__condition')
        format: sql
        rows: |
          select fixture_rows.*, cast(null as timestamp) as ingest_datetime
          from (
          select 'valid' as source_condition_id, 'p1' as person_id, 'a1' as patient_id, 'e1' as encounter_id
            , cast('2020-01-01' as date) as recorded_date, cast('2010-01-01' as date) as onset_date
            , cast('2020-01-01' as date) as resolved_date, null as code_system, null as source_code
            , null as present_on_admit_code, 'source' as data_source
          union all
          select 'date_fail', 'p1', 'a1', 'e1'
            , cast('1899-01-01' as date), cast('2999-01-01' as date), cast('1899-01-01' as date)
            , null, null, null, 'source'
          union all
          select 'pair_fail', 'p1', 'b2', null
            , cast(null as date), cast(null as date), cast(null as date), null, null, null, 'source'
          union all
          select 'encounter_fail', 'p1', 'a1', 'e2'
            , cast(null as date), cast(null as date), cast(null as date), null, null, null, 'source'
          union all
          select 'cross_source_patient_pair', 'cross_person_patient', 'cross_patient_patient', null
            , cast(null as date), cast(null as date), cast(null as date), null, null, null, 'source_b'
          union all
          select 'cross_source_encounter_pair', 'cross_person_encounter', 'cross_patient_encounter', 'cross_encounter'
            , cast(null as date), cast(null as date), cast(null as date), null, null, null, 'source_b'
          ) as fixture_rows
      - input: ref('input_layer__patient')
        format: sql
        rows: |
          select 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
          union all select 'p1', 'a2', 'source'
          union all select 'p2', 'b2', 'source'
          union all select 'cross_person_patient', 'cross_patient_patient', 'source'
          union all select 'cross_person_patient', 'same_source_other_patient', 'source_b'
          union all select 'same_source_other_person', 'cross_patient_patient', 'source_b'
          union all select 'cross_person_encounter', 'cross_patient_encounter', 'source_b'
      - input: ref('input_layer__encounter')
        format: sql
        rows: |
          select 'e1' as encounter_id, 'p1' as person_id, 'a1' as patient_id, 'source' as data_source
          union all select 'e2', 'p2', 'b2', 'source'
          union all select 'cross_encounter', 'cross_person_encounter', 'cross_patient_encounter', 'source'
          union all select 'cross_encounter', 'same_source_other_person', 'same_source_other_patient', 'source_b'
      - input: ref('terminology__icd_10_cm')
        format: sql
        rows: |
          select '__dq_no_match__' as icd_10_cm where 1 = 0
      - input: ref('terminology__icd_9_cm')
        format: sql
        rows: |
          select '__dq_no_match__' as icd_9_cm where 1 = 0
      - input: ref('terminology__snomed_ct')
        format: sql
        rows: |
          select '__dq_no_match__' as snomed_ct where 1 = 0
      - input: ref('terminology__present_on_admission')
        format: sql
        rows: |
          select '__dq_no_match__' as present_on_admit_code where 1 = 0
    expect:
      rows:
        - source_condition_id: valid
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 0
          onset_date_after_resolved_date: 0
          recorded_date_out_of_reasonable_range: 0
          onset_date_out_of_reasonable_range: 0
          resolved_date_out_of_reasonable_range: 0
        - source_condition_id: date_fail
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 0
          onset_date_after_resolved_date: 1
          recorded_date_out_of_reasonable_range: 1
          onset_date_out_of_reasonable_range: 1
          resolved_date_out_of_reasonable_range: 1
        - source_condition_id: pair_fail
          person_patient_pair_not_in_patient: 1
          encounter_person_patient_pair_not_in_encounter: null
          onset_date_after_resolved_date: null
          recorded_date_out_of_reasonable_range: null
          onset_date_out_of_reasonable_range: null
          resolved_date_out_of_reasonable_range: null
        - source_condition_id: encounter_fail
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 1
          onset_date_after_resolved_date: null
          recorded_date_out_of_reasonable_range: null
          onset_date_out_of_reasonable_range: null
          resolved_date_out_of_reasonable_range: null
        - source_condition_id: cross_source_patient_pair
          person_patient_pair_not_in_patient: 1
          encounter_person_patient_pair_not_in_encounter: null
          onset_date_after_resolved_date: null
          recorded_date_out_of_reasonable_range: null
          onset_date_out_of_reasonable_range: null
          resolved_date_out_of_reasonable_range: null
        - source_condition_id: cross_source_encounter_pair
          person_patient_pair_not_in_patient: 0
          encounter_person_patient_pair_not_in_encounter: 1
          onset_date_after_resolved_date: null
          recorded_date_out_of_reasonable_range: null
          onset_date_out_of_reasonable_range: null
          resolved_date_out_of_reasonable_range: null

  - name: test_encounter_identity_and_optional_code_pair_flags
