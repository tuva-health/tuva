      - name: domain_group_name
      - name: component_key
      - name: component_name
      - name: input_table_name
      - name: test_name
      - name: severity
      - name: test_source
      - name: display_name
      - name: description
      - name: test_type
      - name: tested_count
      - name: failed_count
