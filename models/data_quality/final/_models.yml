    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_summary
      materialized: table
    columns:
      - name: data_source
      - name: domain_group_key
      - name: component_key
      - name: pct_passed
      - name: pct_severity_1
      - name: pct_severity_2
      - name: pct_severity_3
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - blocked
                  - issues
                  - passing
                  - not_applicable

  - name: data_quality__summary_by_data_source
