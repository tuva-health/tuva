version: 2

# Schema vocabulary for this file. Every model config points at one of
# these, so a schema is defined once per file rather than once per model.
anchors:
  - &schema |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_data_quality{%- else -%}data_quality{%- endif -%}

models:
  - name: data_quality__catalog_data_source
    description: One row per populated data source and source type, derived from structural metadata and enabled Input Layer tables.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_catalog
      materialized: table
    columns:
      - name: data_source
      - name: data_source_type
      - name: input_table_count
      - name: row_count

  - name: data_quality__catalog_domain
    description: Domain reporting hierarchy for source data quality rollups.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_catalog
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
    columns:
      - name: domain_group_key
        data_tests:
          - not_null
      - name: domain_group_name
      - name: component_key
        data_tests:
          - not_null
      - name: component_name
      - name: display_order

  - name: data_quality__catalog_domain_requirement
    description: Maps source data quality reporting components to required Input Layer tables and optional columns.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_catalog
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - domain_group_key
              - component_key
              - input_table_name
              - input_column_name
              - requirement_source
    columns:
      - name: domain_group_key
        data_tests:
          - not_null
      - name: component_key
        data_tests:
          - not_null
      - name: input_table_name
        data_tests:
          - not_null
      - name: input_column_name
      - name: requirement_level
      - name: requirement_source

  - name: data_quality__catalog_input_layer_column
    description: One row per enabled Input Layer column with table type, expected data type, primary-key metadata, and column order.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_catalog
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - input_table_name
              - input_column_name
    columns:
      - name: input_table_name
        data_tests:
          - not_null
      - name: input_model_name
      - name: input_column_name
        data_tests:
          - not_null
      - name: input_table_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Claims
                  - Clinical
                  - Other
      - name: expected_data_type
      - name: expected_type_family
      - name: is_primary_key
      - name: column_order

  - name: data_quality__catalog_logical_test
    description: One row per enabled logical data quality test with flag-table metadata, severity, check category, affected grain, keys, and investigation SQL.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_catalog
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - test_name
    columns:
      - name: test_name
        data_tests:
          - not_null
      - name: display_name
        data_tests:
          - not_null
      - name: description
        data_tests:
          - not_null
      - name: input_model_name
      - name: input_table_name
      - name: flag_model_name
      - name: flag_table_name
      - name: flag_column_name
      - name: grain
      - name: key_columns
      - name: test_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing
                  - invalid
                  - temporal
                  - referential
                  - consistency
      - name: check_category
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                quote: false
                values:
                  - 1
                  - 2
                  - 3
      - name: default_severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                quote: false
                values:
                  - 1
                  - 2
                  - 3
      - name: investigation_sql

  - name: data_quality__logical_failure_key
    description: Optional key-only drilldown table for logical data quality failures. Disabled by default and enabled with enable_data_quality_failure_keys.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_logical
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: display_name
      - name: description
      - name: test_type
      - name: severity
      - name: key_columns
      - name: key_values

  - name: data_quality__logical_flag_appointment
    description: One row per clinical appointment input record per data source with native-grain keys and 0/1 logical test flags evaluated at the appointment-record grain.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_logical
      materialized: table
    columns:
      - name: appointment_id
      - name: data_source

  - name: data_quality__logical_flag_condition
    description: One row per clinical condition input record per data source with native-grain keys and 0/1 logical test flags evaluated at the condition-record grain.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_logical
      materialized: table
    columns:
      - name: source_condition_id
      - name: data_source

  - name: data_quality__logical_flag_eligibility_person
    description: One row per person per data source with 0/1 logical test flags evaluated across eligibility spans for the person.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
