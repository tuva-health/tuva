      - name: table_name
      - name: table_exists
      - name: table_populated
      - name: columns_exist
      - name: data_types
      - name: primary_keys
      - name: row_count

  - name: data_quality__structural_test_result
    description: Normalized structural data quality results at data source, input table, and structural test grain.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_structural
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: severity
      - name: display_name
      - name: description
      - name: test_type
      - name: tested_count
      - name: failed_count

  - name: data_quality__summary_by_component
