  - name: data_quality__logical_flag_summary
    description: Aggregated logical data quality results derived by summing persisted native-grain flag columns from the logical flag tables.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_logical
      materialized: table
    columns:
      - name: data_source
      - name: table
      - name: test_name
      - name: display_name
      - name: test_result

  - name: data_quality__logical_test_result
    description: One row per data source, input table, and logical test with tested, passed, failed, and not-applicable counts.
    config:
      schema: *schema
      tags:
        - data_quality
        - dq
        - dq1
        - dq_logical
      materialized: table
    columns:
      - name: data_source
      - name: input_table_name
      - name: test_name
      - name: display_name
      - name: description
      - name: test_type
      - name: severity
      - name: total_row_count
      - name: tested_count
      - name: failed_count
      - name: passed_count
      - name: not_applicable_count

  - name: data_quality__structural_table_status
