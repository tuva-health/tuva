  - name: core__utilization
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: utilization
      tags:
        - core
        - utilization
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - member_id
              - year_month
              - payer
              - data_source
              - "{{ quote_column('plan') }}"
    description: |-
      Counts claim-sourced encounters by encounter group and encounter type at the member-month grain.

      This model starts from core__member_month so every eligible member month is included, joins claim-sourced records from core__encounter by person_id, year_month, and data_source, and fills missing utilization counts with zero. It carries payer, custom, and Tuva-assigned attribution fields from core member months.

      Primary key: person_id, member_id, year_month, payer, plan, data_source.
    columns:
      - name: person_id
        description: Unique identifier for the person represented by the member month.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: member_id
        description: Identifier that links the person to a particular insurance product
          or health plan for the member month.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: year_month
        description: Year and month for the member-month or aggregation period.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: payer
        description: Name of the payer associated with the record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: plan
        description: Name of the health plan associated with the record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: payer_attributed_provider
        description: Provider assigned to the member month by the payer.
        config:
          meta:
            data_type: varchar
      - name: payer_attributed_provider_practice
        description: Practice associated with the payer-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: payer_attributed_provider_organization
        description: Organization associated with the payer-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: payer_attributed_provider_lob
        description: Line of business associated with the payer-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: custom_attributed_provider
        description: Provider assigned to the member month by custom attribution logic.
        config:
          meta:
            data_type: varchar
      - name: custom_attributed_provider_practice
        description: Practice associated with the custom-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: custom_attributed_provider_organization
        description: Organization associated with the custom-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: custom_attributed_provider_lob
        description: Line of business associated with the custom-attributed provider.
        config:
          meta:
            data_type: varchar
      - name: tuva_attributed_provider
        description: Provider assigned to the member month by Tuva's claims-based attribution logic. This is copied from the yearly attribution assignment for the same person, data source, and calendar year, and is null when no assignable claims history exists.
        config:
          meta:
            data_type: varchar
      - name: tuva_attributed_provider_bucket
        description: Tuva attribution provider classification bucket, such as PCP, NPP, specialist, or no eligible history.
        config:
          meta:
            data_type: varchar
      - name: tuva_attributed_provider_specialty
        description: Specialty description for the Tuva-attributed provider when available.
        config:
          meta:
            data_type: varchar
      - name: total_encounter_count
        description: Count of all claim-sourced encounters during the member month.
        config:
          meta:
            data_type: integer
      - name: inpatient_count
        description: Count of claim-sourced encounters in the inpatient encounter group.
        config:
