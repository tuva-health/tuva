        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_core
        {% else %}core{%- endif -%}
      alias: cost
      tags:
        - core
        - cost
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - member_id
              - year_month
              - payer
              - data_source
              - "{{ quote_column('plan') }}"
    description: |-
      Computes paid and allowed amounts by service category at the member-month grain.

      This model starts from core.member_month, so payer, custom, and Tuva-assigned attribution fields flow through from core member months without changing cost values.
    columns:
      - name: person_id
        description: Unique identifier for the person represented by the member month.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: member_id
        description: Identifier that links the person to a particular insurance product
          or health plan for the member month.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: year_month
        description: Year and month for the member-month or aggregation period.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: payer
        description: Name of the payer associated with the record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: plan
        description: Name of the health plan associated with the record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: payer_attributed_provider
        description: Provider assigned to the member month by the payer.
        config:
          meta:
            data_type: varchar
      - name: payer_attributed_provider_practice
        description: Practice associated with the payer-attributed provider.
        config:
