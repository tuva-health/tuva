version: 2

unit_tests:
  - name: test_cost_service_category_2_paid_pivot_includes_all_generated_categories
    description: >-
      Protects the complete service-category-2 paid-amount surface for the
      long-term acute care and substance-use categories emitted by Claims
      Preprocessing.
    model: int_cost_service_category_2_paid_pivot
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        tuva_last_run: '2024-02-01 00:00:00'
    given:
      - input: ref('int_cost_service_categories')
        rows:
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: inpatient long term acute care
            total_paid: 10
            data_source: source-1
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: inpatient substance use
            total_paid: 20
            data_source: source-1
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: outpatient substance use
            total_paid: 30
            data_source: source-1
    expect:
      rows:
        - person_id: person-1
          member_id: member-1
          year_month: '202401'
          payer: payer-1
          plan: plan-1
          inpatient_long_term_acute_care_paid: 10
          inpatient_substance_use_paid: 20
          outpatient_substance_use_paid: 30
          data_source: source-1

  - name: test_cost_service_category_2_allowed_pivot_includes_all_generated_categories
    description: >-
      Protects the complete service-category-2 allowed-amount surface for the
      long-term acute care and substance-use categories emitted by Claims
      Preprocessing.
    model: int_cost_service_category_2_allowed_pivot
    config:
      enabled: "{{ var('claims_enabled', false) | as_bool }}"
    overrides:
      vars:
        claims_enabled: true
        tuva_last_run: '2024-02-01 00:00:00'
    given:
      - input: ref('int_cost_service_categories')
        rows:
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: inpatient long term acute care
            total_allowed: 11
            data_source: source-1
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: inpatient substance use
            total_allowed: 21
            data_source: source-1
          - person_id: person-1
            member_id: member-1
            year_month: '202401'
            payer: payer-1
            plan: plan-1
            service_category_2: outpatient substance use
            total_allowed: 31
