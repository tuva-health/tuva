  - name: int_core__encounter_from_claim
    description: |-
      Unions the 26 claims preprocessing encounter tables into the single claims-derived encounter structure that core.encounter consumes.

      The model unions encounter__acute_inpatient through encounter__orphaned_claim with dbt_utils.union_relations, so a new encounter type is picked up by adding it to the relation list. It then casts every field to its core data type, resolves person_id by joining normalized__patient_data_source_id on patient_data_source_id, defaults the service flags to 0 where a source encounter type does not populate them, and falls back to encounter_start_date when encounter_end_date is null.

      Rows are tagged with encounter_source_type of 'claim' and carry source_model, the union's _dbt_source_relation, so an encounter can be traced back to the encounter model that produced it.

      Table grain: One record per encounter.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - core_stage_claims
        - encounters
      materialized: table
    columns:
      - name: encounter_id
        description: Unique identifier for the encounter, assigned by the claims preprocessing encounter grouper.
      - name: person_id
        description: Unique identifier for each person in the dataset, resolved from patient_data_source_id.
      - name: encounter_type
        description: Type of encounter, for example acute inpatient, emergency department, or urgent care.
      - name: encounter_group
        description: Grouping of encounter types into inpatient, outpatient, or other.
      - name: encounter_start_date
        description: Date the encounter began, in YYYY-MM-DD format.
      - name: encounter_end_date
        description: Date the encounter ended, in YYYY-MM-DD format. Falls back to encounter_start_date when the source encounter has no end date.
      - name: length_of_stay
        description: Number of days between the encounter start and end dates.
      - name: admit_source_code
        description: Code indicating where the patient was admitted from.
      - name: admit_source_description
        description: Description of the admit source code.
      - name: admit_type_code
        description: Code indicating the type of admission, for example emergency or elective.
      - name: admit_type_description
        description: Description of the admit type code.
      - name: discharge_disposition_code
        description: Code indicating the patient's status or destination at discharge.
      - name: discharge_disposition_description
        description: Description of the discharge disposition code.
      - name: attending_provider_id
        description: Identifier for the attending provider. Not populated for claims-derived encounters.
      - name: attending_provider_name
        description: Name of the attending provider. Not populated for claims-derived encounters.
      - name: facility_npi
        description: National Provider Identifier of the facility where the encounter occurred.
      - name: facility_name
        description: Name of the facility where the encounter occurred.
      - name: facility_type
        description: Type of facility where the encounter occurred.
      - name: observation_flag
        description: Indicator that the encounter included observation services. 1 for yes, 0 for no.
      - name: lab_flag
        description: Indicator that the encounter included laboratory services. 1 for yes, 0 for no.
      - name: dme_flag
        description: Indicator that the encounter included durable medical equipment. 1 for yes, 0 for no.
      - name: ambulance_flag
        description: Indicator that the encounter included ambulance services. 1 for yes, 0 for no.
      - name: pharmacy_flag
        description: Indicator that the encounter included pharmacy services. 1 for yes, 0 for no.
      - name: ed_flag
        description: Indicator that the encounter included emergency department services. 1 for yes, 0 for no.
      - name: delivery_flag
        description: Indicator that the encounter included a delivery. 1 for yes, 0 for no.
      - name: delivery_type
        description: Type of delivery, when the encounter included one.
      - name: newborn_flag
        description: Indicator that the encounter is a newborn stay. 1 for yes, 0 for no.
      - name: nicu_flag
        description: Indicator that the encounter included neonatal intensive care. 1 for yes, 0 for no.
      - name: snf_part_b_flag
        description: Indicator that the encounter is a skilled nursing facility Part B stay. 1 for yes, 0 for no.
      - name: primary_diagnosis_code_type
        description: Code system of the primary diagnosis code.
      - name: primary_diagnosis_code
        description: Primary diagnosis code for the encounter.
      - name: primary_diagnosis_description
        description: Description of the primary diagnosis code.
      - name: drg_code_type
        description: Type of DRG code, either ms-drg or apr-drg.
      - name: drg_code
        description: Diagnosis related group code for the encounter.
      - name: drg_description
        description: Description of the DRG code.
      - name: paid_amount
        description: Total paid amount across all claims in the encounter.
      - name: allowed_amount
        description: Total allowed amount across all claims in the encounter.
      - name: charge_amount
        description: Total charge amount across all claims in the encounter.
      - name: claim_count
        description: Number of claims in the encounter.
      - name: inst_claim_count
        description: Number of institutional claims in the encounter.
      - name: prof_claim_count
        description: Number of professional claims in the encounter.
      - name: source_model
        description: Encounter model the row came from, taken from the union's _dbt_source_relation. Use this to trace an encounter back to the encounter type that produced it.
      - name: encounter_source_type
        description: Origin of the encounter record. Always 'claim' in this model.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: User-configured field that identifies the source system or payer feed of the claims that formed the encounter.

  - name: int_core__location_from_claim
    description: |-
      Derives claims-derived location records from the provider identifiers present in the claims dataset.

      The model collects the distinct facility, rendering, and billing NPIs from core__medical_claim and the prescribing and dispensing NPIs from core__pharmacy_claim, joins that roster to provider_data__provider, and keeps only providers whose NPPES entity type is organization. Individual providers are handled by int_core__practitioner_from_claim.

      The NPI is used directly as location_id. facility_type, latitude, longitude, and data_source are not derivable from NPPES and are set to null.

      Table grain: One record per NPI.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - core_stage_claims
      materialized: table
    columns:
      - name: location_id
        description: Identifier for the location. Set to the organization's NPI.
      - name: npi
        description: National Provider Identifier of the organization.
      - name: name
        description: Organization name from NPPES.
      - name: facility_type
        description: Type of facility. Not derivable from NPPES and always null in this model.
      - name: parent_organization
        description: Parent organization name from NPPES.
      - name: address
        description: Practice street address from NPPES.
      - name: city
        description: Practice city from NPPES.
      - name: state
        description: Practice state from NPPES.
      - name: zip_code
        description: Practice ZIP code from NPPES.
      - name: latitude
        description: Decimal-degree latitude of the location. Not derivable from NPPES and always null in this model.
      - name: longitude
        description: Decimal-degree longitude of the location. Not derivable from NPPES and always null in this model.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: Data source of the record. Always null in this model, because the roster is built from NPPES rather than from a single customer feed.

  - name: int_core__medication_from_claim
    description: |-
      This model maps core pharmacy claim rows into the medication structure so pharmacy claims can contribute claims-derived rows to core.medication.

      Every row is tagged with source_type of 'claims' and uses pharmacy_claim_id as medication_id. NDC code and description are carried into both the source_code and ndc_code fields. Fields that a pharmacy claim cannot supply — patient_id, encounter_id, prescribing_date, rxnorm_code, atc_code, route, strength, and quantity_unit — are set to null; core.medication populates rxnorm_code and atc_code downstream by joining NDC terminology.

      Table grain: One record per pharmacy claim line.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - core_stage_claims
      materialized: table
    columns:
      - name: medication_id
        description: Identifier for the medication record. Set to pharmacy_claim_id.
      - name: source_type
        description: Origin of the medication record. Always 'claims' in this model.
      - name: person_id
        description: Unique identifier for each person in the dataset.
      - name: member_id
        description: Identifier assigned by the payer or health plan for the covered member.
      - name: patient_id
        description: Clinical source-system identifier for the patient. Always null for claims-derived rows.
      - name: encounter_id
        description: Encounter identifier. Always null for claims-derived medication rows.
      - name: claim_id
        description: Source pharmacy claim identifier.
      - name: claim_line_number
        description: Line number within the pharmacy claim.
      - name: payer
        description: Name of the payer or health insurer for the claim.
      - name: plan
        description: Name of the health plan for the claim.
      - name: dispensing_date
        description: Date the medication was dispensed.
      - name: prescribing_date
        description: Date the medication was prescribed. Always null for claims-derived rows.
      - name: source_code_type
        description: Code system of the source code. Always 'ndc' in this model.
      - name: source_code
        description: NDC code from the pharmacy claim.
      - name: source_description
        description: NDC description from the pharmacy claim.
      - name: ndc_code
        description: NDC code from the pharmacy claim.
      - name: ndc_description
        description: NDC description from the pharmacy claim.
      - name: rxnorm_code
        description: RxNorm code. Null in this model; populated by core.medication from NDC terminology.
      - name: atc_code
        description: Anatomical Therapeutic Chemical code. Null in this model; populated by core.medication from NDC terminology.
      - name: route
        description: Route of administration. Not available on a pharmacy claim and always null.
      - name: strength
        description: Medication strength. Not available on a pharmacy claim and always null.
      - name: quantity
        description: Quantity dispensed.
      - name: quantity_unit
        description: Unit for the dispensed quantity. Not available on a pharmacy claim and always null.
      - name: days_supply
        description: Number of days the dispensed quantity is expected to last.
      - name: practitioner_id
        description: Identifier for the prescribing provider, taken from prescribing_provider_id.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: User-configured field that identifies the source system or payer feed of the pharmacy claim.

  - name: int_core__patient_deduplicated
    description: |-
      This model removes duplicate clinical patient records for each person_id and data_source. When multiple upstream records exist, it keeps the record with the latest non-null ingest_datetime, then uses patient_id descending as a tie-breaker.

      Primary key: person_id, data_source.
    config:
      schema: *schema_intermediate
      meta:
        dag:
          node_type: intermediate
      tags:
        - core
        - core_stage_clinical
      materialized: table
    columns:
      - name: person_id
        description: Globally unique identifier for the person across the dataset. This
          should remain stable even when the person has multiple patient IDs or
          medical record numbers.
        config:
          meta:
            is_primary_key: true
      - name: patient_id
        description: Identifier for the person in a specific clinical source system,
          such as MRN. A single person can have multiple patient IDs.
      - name: first_name
        description: Patient first name as represented in the source system.
      - name: middle_name
        description: Patient middle name as represented in the source system.
      - name: last_name
        description: Patient last name as represented in the source system.
      - name: name_suffix
        description: Patient name suffix, such as Jr., Sr., or III.
      - name: sex
        description: Biological sex of the patient. Accepted values are male, female, or
          unknown, all lowercase.
      - name: race
        description: Patient race. This value should match a Tuva race terminology
          description.
      - name: ethnicity
        description: Patient ethnicity. This value should match a Tuva ethnicity
          terminology code.
      - name: birth_date
        description: Patient date of birth in YYYY-MM-DD format.
      - name: death_date
        description: Patient date of death in YYYY-MM-DD format. Leave null if the
          patient is not deceased or if no death date is available.
      - name: death_flag
        description: Indicator that the patient is deceased. Use 1 for deceased and 0
          for not known deceased.
      - name: social_security_number
        description: Patient Social Security number as a string in XXX-XX-XXXX format,
          including dashes, when available and permitted.
      - name: address
        description: Street address where the patient lives.
      - name: city
        description: City where the patient lives.
      - name: state
        description: State where the patient lives.
      - name: zip_code
        description: ZIP code where the patient lives.
      - name: county
        description: County where the patient lives.
      - name: latitude
        description: Decimal-degree latitude for the patient's address, when available.
      - name: longitude
        description: Decimal-degree longitude for the patient's address, when available.
      - name: phone
        description: Patient phone number as represented in the source system.
      - name: email
        description: Patient email address as represented in the source system.
      - name: ingest_datetime
        description: Date and time the patient record was extracted from the source
          system or ingested into the data warehouse.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by
          `dbt_utils.pretty_time` as the local time of the `dbt run`
          environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: User-defined name that identifies the clinical source, for example
          Epic, Athena Health, or Cerner. This value should be populated on
          every record.
        config:
          meta:
            is_primary_key: true

  - name: int_core__practitioner_from_claim
    description: |-
      Derives claims-derived practitioner records from the provider identifiers present in the claims dataset.

      The model collects the distinct facility, rendering, and billing NPIs from core__medical_claim and the prescribing and dispensing NPIs from core__pharmacy_claim, joins that roster to provider_data__provider, and keeps only providers whose NPPES entity type is individual. Organizations are handled by int_core__location_from_claim.

      The NPI is used directly as practitioner_id. sub_specialty and data_source are not derivable from NPPES and are set to null.

      Table grain: One record per NPI.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - core_stage_claims
      materialized: table
    columns:
      - name: practitioner_id
        description: Identifier for the practitioner. Set to the individual's NPI.
      - name: npi
        description: National Provider Identifier of the individual provider.
      - name: first_name
        description: Provider first name from NPPES.
      - name: last_name
        description: Provider last name from NPPES.
      - name: practice_affiliation
        description: Parent organization name from NPPES.
      - name: specialty
        description: Primary specialty description from NPPES.
      - name: sub_specialty
        description: Provider sub-specialty. Not derivable from NPPES and always null in this model.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: Data source of the record. Always null in this model, because the roster is built from NPPES rather than from a single customer feed.

  - name: int_core__procedure_from_claim
    description: |-
      Creates core-ready claims-derived procedure rows from normalized__medical_claim_procedure. This model joins normalized procedure rows to the claims preprocessing encounter claim-line crosswalk to populate encounter_id, then creates the Tuva synthetic procedure_id used by core.procedure.
    config:
      schema: *schema_intermediate
      tags: core
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - procedure_id
    columns:
      - name: procedure_id
        description: Tuva synthetic identifier for the claims-derived procedure row.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: encounter_id
        description: Encounter identifier assigned to the source claim line or claim by the claims preprocessing encounter grouper.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Source claim identifier from normalized__medical_claim_procedure.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: Procedure code system for source_code and normalized_code.
        config:
          meta:
            data_type: varchar
      - name: source_code
        description: Procedure code from the source claim.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Procedure code after matching to Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: data_source
        description: Data source associated with the claim.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar
