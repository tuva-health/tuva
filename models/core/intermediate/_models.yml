version: 2

# Schema vocabulary for this file. Every model config points at one of
# these, so a schema is defined once per file rather than once per model.
anchors:
  - &schema_intermediate |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate{%- else -%}intermediate{%- endif -%}

models:
  - name: int_core__condition_from_claim
    description: |
      Creates core-ready claims-derived condition rows from normalized__medical_claim_diagnosis. This model joins the normalized diagnosis rows to the claims preprocessing encounter claim-line crosswalk to populate encounter_id, then creates the Tuva synthetic condition_id used by core.condition.
    config:
      schema: *schema_intermediate
      tags: core
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - condition_id
    columns:
      - name: condition_id
        description: Tuva synthetic identifier for the claims-derived condition row.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: encounter_id
        description: Encounter identifier assigned to the source claim line by the claims preprocessing encounter grouper.
        config:
          meta:
            data_type: varchar
      - name: claim_id
        description: Source claim identifier from normalized__medical_claim_diagnosis.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: Diagnosis code system for source_code and normalized_code.
        config:
          meta:
            data_type: varchar
      - name: source_code
        description: Diagnosis code from the source claim after removing decimal formatting.
        config:
          meta:
            data_type: varchar
      - name: normalized_code
        description: Diagnosis code after matching to Tuva terminology.
        config:
          meta:
            data_type: varchar
      - name: data_source
        description: Data source associated with the claim line.
        data_tests:
          - not_null
        config:
          meta:
            data_type: varchar

  - name: int_core__cost_service_category
    description: |-
      Combines medical and pharmacy claims into a single per-member-per-month cost fact, carrying the service categories assigned by the claims preprocessing service category grouper.

      Medical claim lines come from core__medical_claim with their service_category_1 and service_category_2 values. Pharmacy claim lines come from core__pharmacy_claim and are assigned service_category_1 of 'pharmacy' with a null service_category_2. Both sides derive year_month from the claim date, using coalesce(claim_start_date, claim_end_date) for medical and coalesce(dispensing_date, paid_date) for pharmacy. Paid and allowed amounts are then summed to the member-month and service-category grain.

      This model is the single source the four cost pivot models read.

      Table grain: One record per person, member, year_month, payer, plan, service_category_1, service_category_2, and data_source.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - cost
      materialized: table
    columns:
      - name: person_id
        description: Unique identifier for each person in the dataset.
      - name: member_id
        description: Identifier assigned by the payer or health plan for the covered member.
      - name: year_month
        description: Year and month of the claim in YYYYMM format, derived from the claim date.
      - name: payer
        description: Name of the payer or health insurer for the claim.
      - name: plan
        description: Name of the health plan for the claim.
      - name: service_category_1
        description: Highest-level service category assigned by the service category grouper. Pharmacy claims are assigned 'pharmacy'.
      - name: service_category_2
        description: Second-level service category assigned by the service category grouper. Null for pharmacy claims.
      - name: total_paid
        description: Sum of paid amounts for the member-month and service category.
      - name: total_allowed
        description: Sum of allowed amounts for the member-month and service category.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.
      - name: data_source
        description: User-configured field that identifies the source system or payer feed of the claim.

  - name: int_core__cost_service_category_1_allowed_pivot
    description: |-
      Pivots allowed amounts from int_core__cost_service_category into one column per service_category_1 value, so core.cost can carry them as columns rather than rows.

      Six categories are pivoted: inpatient, outpatient, office-based, ancillary, other, and pharmacy. A member-month with no spend in a category receives 0 rather than null.

      Table grain: One record per person, member, year_month, payer, plan, and data_source.
    config:
      schema: *schema_intermediate
      tags:
        - core
        - cost
      materialized: table
    columns:
      - name: person_id
        description: Unique identifier for each person in the dataset.
      - name: member_id
        description: Identifier assigned by the payer or health plan for the covered member.
      - name: year_month
        description: Year and month of the claim in YYYYMM format.
      - name: payer
        description: Name of the payer or health insurer for the claim.
      - name: plan
        description: Name of the health plan for the claim.
      - name: data_source
        description: User-configured field that identifies the source system or payer feed of the claim.
      - name: inpatient_allowed
        description: Per member per month allowed amount for inpatient services.
      - name: outpatient_allowed
        description: Per member per month allowed amount for outpatient services.
      - name: office_based_allowed
        description: Per member per month allowed amount for office-based services.
      - name: ancillary_allowed
        description: Per member per month allowed amount for ancillary services.
      - name: other_allowed
        description: Per member per month allowed amount for services not assigned to another service category.
      - name: pharmacy_allowed
        description: Per member per month allowed amount for pharmacy claims.
      - name: tuva_last_run
        description: The last time the data was refreshed. Generated by `dbt_utils.pretty_time` as the local time of the `dbt run` environment. Timezone is configurable via the `tuva_last_run` var.

