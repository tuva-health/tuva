version: 2

# Schema vocabulary for this file. Every model config points at one of
# these, so a schema is defined once per file rather than once per model.
anchors:
  - &schema_intermediate |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_intermediate{%- else -%}intermediate{%- endif -%}

models:
  - name: int_encounter__acute_inpatient_generate_id
    description: generate encounter id and stitch inpatient psych claims together
    config:
      schema: *schema_intermediate
      materialized: table
      tags:
        - claims_preprocessing
        - encounters

  - name: int_encounter__acute_inpatient_professional_claim
    description: match corresponding prof claims to institutional claims
    config:
      schema: *schema_intermediate
      materialized: table
      tags:
        - claims_preprocessing
        - encounters

