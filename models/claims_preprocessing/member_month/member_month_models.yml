version: 2

models:
  - name: member_month__month_spine
    description: |-
      Internal package-owned sequence of complete calendar months from January 1900 through December 2100. Claims Preprocessing uses this spine for month-grain expansion and provider-attribution windows without requiring dates to exist in the published daily terminology calendar.

      Table grain: One record per calendar month.
    config:
      materialized: ephemeral
      tags:
        - claims_preprocessing
        - member_month
    columns:
      - name: year_month
        description: Six-character calendar period key in YYYYMM format.
      - name: year_month_int
        description: Integer calendar period key in YYYYMM format.
      - name: year
        description: Four-digit calendar year.
      - name: month
        description: Calendar month number from 1 through 12.
      - name: first_day_of_month
        description: First day of the calendar month.
      - name: last_day_of_month
        description: Last day of the calendar month.

  - name: member_month__member_month
    description: |-
      This model creates claims preprocessing member-month records from normalized eligibility spans. It joins normalized eligibility records to the package-owned 1900-through-2100 month spine so that each span is expanded into one record for each covered year-month. Expansion always stops at the date portion of tuva_last_run, including when a finite enrollment end date is later, so Tuva never creates future member months. It then creates member_month_id as a synthetic key from person_id, member_id, year_month, payer, plan, and data_source, and pulls through eligibility extension columns.

      Table grain: One record per person, member, year month, payer, plan, and data source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing{% else %}claims_preprocessing{%- endif -%}
      alias: member_month
      materialized: table
      tags:
        - claims_preprocessing
        - member_month
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - member_month_id
    columns:
      - name: member_month_id
        description: Synthetic key created from person_id, member_id, year_month, payer, plan, and data_source.
        tests:
          - not_null
          - unique
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person covered during the member month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: year_month
        description: Calendar month of eligibility represented by the member month, formatted as YYYYMM.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer providing coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the member month.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp for when the model was last run.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the eligibility data used to create the member month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
