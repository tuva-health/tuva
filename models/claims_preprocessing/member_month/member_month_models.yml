version: 2

models:
  - name: member_month__member_month
    description: |-
      This model creates claims preprocessing member-month records from normalized eligibility spans. It joins normalized eligibility records to the calendar terminology table so that each eligibility span is expanded into one record for each covered year-month. For an open span with a null enrollment_end_date, the effective end is the date portion of tuva_last_run, so expansion includes the calendar month containing that date; finite end dates are not capped. It then creates member_month_id as a synthetic key from person_id, member_id, year_month, payer, plan, and data_source, and pulls through eligibility extension columns.

      Table grain: One record per person, member, year month, payer, plan, and data source.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_claims_preprocessing{% else %}claims_preprocessing{%- endif -%}
      alias: member_month
      materialized: table
      tags:
        - claims_preprocessing
        - member_month
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - member_month_id
    columns:
      - name: member_month_id
        description: Synthetic key created from person_id, member_id, year_month, payer, plan, and data_source.
        tests:
          - not_null
          - unique
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: Globally unique identifier for the person covered during the member month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
      - name: member_id
        description: Identifier assigned by the payer or health plan for the person's coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: year_month
        description: Calendar month of eligibility represented by the member month, formatted as YYYYMM.
        config:
          meta:
            data_type: varchar
      - name: payer
        description: Name of the payer providing coverage during the member month.
        config:
          meta:
            data_type: varchar
      - name: plan
        description: Name of the health insurance plan or product associated with the member month.
        config:
          meta:
            data_type: varchar
      - name: tuva_last_run
        description: Timestamp for when the model was last run.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: User-defined name that identifies the source of the eligibility data used to create the member month.
        tests:
          - not_null
        config:
          meta:
            data_type: varchar
