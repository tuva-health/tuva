version: 2

unit_tests:
  - name: test_normalized_encounter_derives_group_from_encounter_type
    description: >-
      Proves that clinical encounter_group comes from the canonical encounter
      type terminology, covers each supported group, preserves source rows, and
      remains null when encounter_type is null or has no terminology match.
    model: normalized__encounter
    config:
      enabled: "{{ var('clinical_enabled', false) | as_bool }}"
    overrides:
      vars:
        _extension_columns_override: []
        tuva_last_run: '2024-01-01 00:00:00'
    given:
      - input: ref('input_layer__encounter')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set timestamp_type = 'datetime2(0)' if target.type in ['fabric', 'sqlserver'] else 'timestamp' %}
          {% set numeric_type = 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' %}
          select
              'enc-inpatient' as encounter_id
            , 'person-1' as person_id
            , 'patient-1' as patient_id
            , 'acute inpatient' as encounter_type
            , cast('2024-01-01' as date) as encounter_start_date
            , cast('2024-01-03' as date) as encounter_end_date
            , cast(null as {{ string_type }}) as admit_source_code
            , cast(null as {{ string_type }}) as admit_type_code
            , cast(null as {{ string_type }}) as discharge_disposition_code
            , cast(null as {{ string_type }}) as attending_provider_id
            , cast(null as {{ string_type }}) as attending_provider_name
            , cast(null as {{ string_type }}) as facility_npi
            , cast(null as {{ string_type }}) as facility_name
            , cast(null as {{ string_type }}) as primary_diagnosis_code_type
            , cast(null as {{ string_type }}) as primary_diagnosis_code
            , cast(null as {{ string_type }}) as drg_code_type
            , cast(null as {{ string_type }}) as drg_code
            , cast(null as {{ numeric_type }}) as paid_amount
            , cast(null as {{ numeric_type }}) as allowed_amount
            , cast(null as {{ numeric_type }}) as charge_amount
            , cast(null as {{ timestamp_type }}) as ingest_datetime
            , 'source-ehr' as data_source
          union all
          select
              'enc-outpatient', 'person-2', 'patient-2', 'emergency department'
            , cast('2024-02-01' as date), cast('2024-02-01' as date)
            , null, null, null, null, null, null, null, null, null, null, null
            , cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ timestamp_type }}), 'source-ehr'
          union all
          select
              'enc-office', 'person-3', 'patient-3', 'office visit'
            , cast('2024-03-01' as date), cast('2024-03-01' as date)
            , null, null, null, null, null, null, null, null, null, null, null
            , cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ timestamp_type }}), 'source-ehr'
          union all
          select
              'enc-other', 'person-4', 'patient-4', 'orphaned claim'
            , cast('2024-04-01' as date), cast('2024-04-01' as date)
            , null, null, null, null, null, null, null, null, null, null, null
            , cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ timestamp_type }}), 'source-ehr'
          union all
          select
              'enc-unmatched', 'person-5', 'patient-5', 'source-only value'
            , cast('2024-05-01' as date), cast('2024-05-01' as date)
            , null, null, null, null, null, null, null, null, null, null, null
            , cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ timestamp_type }}), 'source-ehr'
          union all
          select
              'enc-null', 'person-6', 'patient-6', cast(null as {{ string_type }})
            , cast('2024-06-01' as date), cast('2024-06-01' as date)
            , null, null, null, null, null, null, null, null, null, null, null
            , cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ numeric_type }}), cast(null as {{ timestamp_type }}), 'source-ehr'
      - input: ref('terminology__encounter_type')
        format: sql
        rows: |
          select 'acute inpatient' as encounter_type, 'inpatient' as encounter_group
          union all
          select 'emergency department', 'outpatient'
          union all
          select 'office visit', 'office based'
          union all
          select 'orphaned claim', 'other'
      - input: ref('terminology__admit_source')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as admit_source_code
            , cast(null as {{ string_type }}) as admit_source_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__admit_type')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as admit_type_code
            , cast(null as {{ string_type }}) as admit_type_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__discharge_disposition')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as discharge_disposition_code
            , cast(null as {{ string_type }}) as discharge_disposition_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__icd_10_cm')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as icd_10_cm
            , cast(null as {{ string_type }}) as long_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__icd_9_cm')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as icd_9_cm
            , cast(null as {{ string_type }}) as long_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__ms_drg')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as ms_drg_code
            , cast(null as {{ string_type }}) as ms_drg_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
      - input: ref('terminology__apr_drg')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          select
              cast(null as {{ string_type }}) as apr_drg_code
            , cast(null as {{ string_type }}) as apr_drg_description
          from (select 1 as _tuva_empty_fixture) as _tuva_empty_fixture where 1 = 0
    expect:
      rows:
        - encounter_id: enc-inpatient
          encounter_type: acute inpatient
          encounter_group: inpatient
          length_of_stay: 2
          data_source: source-ehr
        - encounter_id: enc-outpatient
          encounter_type: emergency department
          encounter_group: outpatient
          length_of_stay: 1
          data_source: source-ehr
        - encounter_id: enc-office
          encounter_type: office visit
          encounter_group: office based
          length_of_stay: 1
          data_source: source-ehr
        - encounter_id: enc-other
          encounter_type: orphaned claim
          encounter_group: other
          length_of_stay: 1
          data_source: source-ehr
        - encounter_id: enc-unmatched
          encounter_type: source-only value
          encounter_group: null
          length_of_stay: 1
          data_source: source-ehr
        - encounter_id: enc-null
          encounter_type: null
          encounter_group: null
          length_of_stay: 1
          data_source: source-ehr
