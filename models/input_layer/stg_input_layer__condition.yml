version: 2

# Schema vocabulary for this file. Every model config points at one of
# these, so a schema is defined once per file rather than once per model.
anchors:
  - &schema_staging |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_staging{%- else -%}staging{%- endif -%}

models:
  - name: stg_input_layer__condition
    description: >-
      The condition table is intended to have one record per condition record per data source. This table stores diagnoses, problems, and other condition records from clinical source systems, including problem list entries, encounter diagnoses, admitting diagnoses, and discharge diagnoses when those records are available from the source system.


      A condition may be linked to an encounter when that relationship exists, but not every condition will have an encounter_id. The source code fields should preserve the condition coding from the source system. Tuva normalizes supported source code systems in the Normalized Layer before core.condition.


      Claims-derived diagnoses should be mapped to the medical_claim input layer table. They are added to core.condition downstream from medical claims, not from this clinical input layer table.


      Primary key: source_condition_id, data_source.
    config:
      schema: *schema_staging
      tags: input_layer
      materialized: view
    columns:
      - name: source_condition_id
        description: >-
          This is the source system identifier for the condition record. Most EHRs will include some sort of condition table and that table will have a primary key typically called condition_id or something similar. You should map that field to this field. This value should be populated on every record and should uniquely identify the condition record across all data sources when combined with data_source. Tuva uses this field to create the synthetic condition_id in core.condition.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: person_id
        description: >-
          Globally unique identifier for the person associated with the condition. A person may have multiple patient IDs over time or across clinical source systems, but person_id should remain stable for the same person. If a separate globally unique person identifier is not available, map patient_id to person_id so both fields contain the same value.
        config:
          meta:
            data_type: varchar
      - name: patient_id
        description: >-
          Identifier that links the person to a particular clinical source system, for example a medical record number or MRN. A single person may have multiple patient IDs.
        config:
          meta:
            data_type: varchar
      - name: encounter_id
        description: >-
          Identifier for the clinical encounter associated with the condition. Populate this when the condition was documented during, or is linked to, a clinical encounter. Leave null when the condition is not encounter-specific.
        config:
          meta:
            data_type: varchar
      - name: recorded_date
        description: >-
          Date the condition was recorded or documented in the source system, formatted as YYYY-MM-DD.
        config:
          meta:
            data_type: date
      - name: onset_date
        description: >-
          Date the condition began or was first clinically present, formatted as YYYY-MM-DD. Leave null when the onset date is unknown or unavailable.
        config:
          meta:
            data_type: date
      - name: resolved_date
        description: >-
          Date the condition resolved or became inactive, formatted as YYYY-MM-DD. Leave null when the condition is active, unresolved, or the resolved date is unknown.
        config:
          meta:
            data_type: date
      - name: status
        description: >-
          Source status of the condition record, such as active, resolved, inactive, historical, suspected, or entered-in-error.
        config:
          meta:
            data_type: varchar
      - name: condition_type
        description: >-
          Category of condition record, such as problem, encounter diagnosis, admitting diagnosis, or discharge diagnosis. This field helps distinguish problem list conditions from diagnoses documented for an encounter in a clinical source system.
        config:
          meta:
            data_type: varchar
      - name: code_system
        description: >-
          Code system for source_code. Accepted values are icd-10-cm, icd-9-cm, snomed-ct, and unknown. Map this field to unknown when the source code system is unknown.
        config:
          meta:
            data_type: varchar
      - name: source_code
        description: >-
          Condition code from the source system before Tuva normalization. For ICD diagnosis codes, the source may include or omit decimal formatting.
        config:
          meta:
            data_type: varchar
      - name: source_description
        description: >-
          Human-readable description of the source condition code or condition record, when available from the source system.
        config:
          meta:
            data_type: varchar
      - name: condition_rank
        description: >-
          Numeric rank of the condition when the source provides diagnosis ordering. A value of 1 generally represents the primary diagnosis, and values greater than 1 represent secondary diagnoses. Leave null when the condition is not ranked, such as many problem list records.
        config:
          meta:
            data_type: number
      - name: present_on_admit_code
        description: >-
          Present-on-admission indicator for the condition, when applicable. This is most relevant for inpatient facility diagnoses and should be left null when not applicable or unavailable.
        config:
          meta:
            data_type: varchar
      - name: ingest_datetime
        description: >-
          Date and time the source condition record was loaded into the data warehouse. This is useful when multiple versions of the same condition record are received over time.
        config:
          meta:
            data_type: timestamp
      - name: data_source
        description: >-
          User-defined name that identifies the source of the condition data, for example Epic, Athena Health, or Cerner. This value should be populated on every record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
