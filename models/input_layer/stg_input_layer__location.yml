version: 2

# Schema vocabulary for this file. Every model config points at one of
# these, so a schema is defined once per file rather than once per model.
anchors:
  - &schema_staging |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_staging{%- else -%}staging{%- endif -%}

models:
  - name: stg_input_layer__location
    description: |-
      The location table contains information about physical locations where clinical care is delivered, documented, or managed. A location may represent a facility, clinic, department, practice site, laboratory, imaging center, or other service location.

      This table is intended to have one record per location ID and data source. The location_id field should identify the location within the clinical source system and can be referenced by other clinical input layer tables, such as appointment and immunization, when those records are associated with a location.

      Primary key: location_id, data_source.
    config:
      schema: *schema_staging
      tags: input_layer
      materialized: view
    columns:
      - name: location_id
        description: Identifier for a location within a data source. This should be the stable source system identifier for the facility, department, clinic, practice site, or other location.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
      - name: npi
        description: National Provider Identifier associated with the location, when available. For facilities or organizations, this should generally be an organization NPI rather than an individual practitioner NPI. Leave null when the location does not have an NPI.
        config:
          meta:
            data_type: varchar
      - name: name
        description: Name of the location as represented in the source system.
        config:
          meta:
            data_type: varchar
      - name: facility_type
        description: Type or category of location, for example hospital, clinic, emergency department, ambulatory surgery center, laboratory, imaging center, or department. Use the source system value.
        config:
          meta:
            data_type: varchar
      - name: parent_organization
        description: Organization, health system, practice group, or parent facility associated with the location, when available.
        config:
          meta:
            data_type: varchar
      - name: address
        description: Street address of the location.
        config:
          meta:
            data_type: varchar
      - name: city
        description: City of the location.
        config:
          meta:
            data_type: varchar
      - name: state
        description: State of the location. For US addresses, use the two-character state abbreviation when available.
        config:
          meta:
            data_type: varchar
      - name: zip_code
        description: ZIP code or postal code of the location.
        config:
          meta:
            data_type: varchar
      - name: latitude
        description: Latitude of the location in decimal degrees, when available.
        config:
          meta:
            data_type: float
      - name: longitude
        description: Longitude of the location in decimal degrees, when available.
        config:
          meta:
            data_type: float
      - name: data_source
        description: User-defined name that identifies the source system for the location data, for example Epic, Athena Health, or Cerner. This value should be populated on every record.
        config:
          meta:
            data_type: varchar
            is_primary_key: true
