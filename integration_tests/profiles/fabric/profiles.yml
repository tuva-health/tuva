default:
  target: ci
  outputs:
    ci:
      type: fabric
      driver: ODBC Driver 18 for SQL Server
      # dbt-fabric 1.11.1 emits an unsupported `Authority Id` connection
      # string field for ActiveDirectoryServicePrincipal authentication.
      # Environment auth uses the same service principal through Azure Identity.
      authentication: environment
      server: "{{ env_var('DBT_FABRIC_CI_SERVER') }}"
      database: "{{ env_var('DBT_FABRIC_CI_DATABASE') }}"
      schema: "{{ env_var('DBT_FABRIC_CI_SCHEMA') }}_{{ env_var('TUVA_CI_SCHEMA_PREFIX') }}"
      encrypt: True
      trust_cert: False
      login_timeout: 30
      threads: 4
