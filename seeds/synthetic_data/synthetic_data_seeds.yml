version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &string   - short codes and identifiers
#   &date     - calendar date
#   &datetime - timestamp without time zone
#   &integer  - whole number
#   &float    - 64-bit floating point
anchors:
  - &schema |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_synthetic_data{% else %}synthetic_data{%- endif -%}
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &date date
  - &datetime |
    {%- if target.type == "fabric" -%} datetime2(0)
    {%- elif target.type in ("athena", "databricks", "postgres", "redshift") -%} timestamp
    {%- else -%} datetime
    {%- endif -%}
  - &integer integer
  - &float |
    {%- if target.type == "bigquery" -%} float64
    {%- elif target.type in ("athena", "databricks") -%} double
    {%- elif target.type == "fabric" -%} float
    {%- else -%} double precision
    {%- endif -%}

seeds:
  - name: synthetic_data__appointment
    description: |-
      Synthetic appointment records provide non-PHI clinical scheduling data for local development, demos,
      documentation, and integration testing. They are maintained by Tuva Health.
    config:
      meta:
        primary_key_columns:
          - appointment_id
          - data_source
        primary_key_strategy: natural_multi_column
        data_asset:
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: "Tuva synthetic data v1.2.4"
          source_last_updated: ""
          tuva_last_updated: "2026-06-25"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_synthetic_seed('appointment') }}"
      schema: *schema
      alias: appointment
      tags:
        - synthetic_data
        - clinical
      enabled: "{{ var('use_synthetic_data', false) | string | trim | lower == 'true' }}"
      column_types:
        appointment_id: *string
        person_id: *string
        patient_id: *string
        encounter_id: *string
        start_datetime: *datetime
        end_datetime: *datetime
        duration: *integer
        location_id: *string
        practitioner_id: *string
        type_code: *string
        type_description: *string
        status_code: *string
