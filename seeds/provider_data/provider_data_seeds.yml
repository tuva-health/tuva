version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &schema  - target schema for this data asset family
#   &string  - short codes and identifiers
#   &text    - long free text
#   &date    - calendar date
#   &integer - whole number
anchors:
  - &schema |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_provider_data{% else %}provider_data{%- endif -%}
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(3000)
    {%- endif -%}
  - &date date
  - &integer integer

seeds:
  - name: provider_data__other_provider_taxonomy
    description: |-
      Other provider taxonomy records capture secondary taxonomy assignments for NPIs beyond the primary
      taxonomy. They are derived from CMS NPPES provider data and NUCC taxonomy codes.
    config:
      meta:
        primary_key_columns:
          - npi
          - taxonomy_code
        primary_key_strategy: natural_multi_column
        data_asset:
          maintainer: "CMS NPPES and NUCC"
          source_url: "https://download.cms.gov/nppes/NPI_Files.html"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('provider_data','other_provider_taxonomy.csv') }}"
      schema: *schema
      tags:
        - provider_data
        - claims_preprocessing
      alias: other_provider_taxonomy
      column_types:
        npi: *string
        taxonomy_code: *string
        medicare_specialty_code: *string
        description: *string
        primary_flag: *integer
    columns:
      - name: npi
        description: 'The National Provider Identifier (NPI).'
      - name: taxonomy_code
        description: 'The provider taxonomy code.'
      - name: medicare_specialty_code
        description: 'The Medicare specialty code.'
      - name: description
        description: 'Description of the provider taxonomy.'
      - name: primary_flag
        description: 'Indicates if this is the primary taxonomy (1) or not (0).'

  - name: provider_data__provider
    description: |-
      Provider records contain public NPI profile information used for provider enrichment, specialty
      grouping, and attribution workflows. They are maintained by CMS in NPPES.
    config:
      meta:
        data_asset:
          maintainer: "CMS NPPES"
          source_url: "https://download.cms.gov/nppes/NPI_Files.html"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "monthly"
      post_hook: "{{ load_versioned_seed('provider_data','provider.csv') }}"
      schema: *schema
      tags:
        - provider_data
        - claims_preprocessing
      alias: provider
      column_types:
        npi: *string
        entity_type_code: *string
        entity_type_description: *string
        primary_taxonomy_code: *string
        primary_specialty_description: *string
        provider_first_name: *string
        provider_last_name: *string
        provider_credential: *string
        provider_organization_name: *string
        provider_other_organization_name: *string
        provider_other_organization_name_type_code: *string
        provider_other_organization_name_type_description: *string
        parent_organization_name: *string
        practice_address_line_1: *string
        practice_address_line_2: *string
        practice_city: *string
        practice_state: *string
        practice_zip_code: *string
        mailing_telephone_number: *string
        location_telephone_number: *string
        official_telephone_number: *string
        last_updated: *date
        deactivation_date: *date
        deactivation_flag: *string
    columns:
      - name: npi
        description: 'The National Provider Identifier (NPI).'
      - name: entity_type_code
        description: 'The entity type code of the provider.'
      - name: entity_type_description
        description: 'The entity type description of the provider.'
      - name: primary_taxonomy_code
        description: 'The primary taxonomy code of the provider.'
      - name: primary_specialty_description
        description: 'The primary specialty description of the provider.'
      - name: provider_first_name
        description: 'The first name of the provider.'
      - name: provider_last_name
        description: 'The last name of the provider.'
      - name: provider_credential
        description: 'The credential of the provider.'
      - name: provider_organization_name
        description: 'The organization name of the provider.'
      - name: provider_other_organization_name
        description: 'Other organization name of the provider (for Type 2 NPI).'
      - name: provider_other_organization_name_type_code
        description: 'The type code for the other organization name of the provider.'
      - name: provider_other_organization_name_type_description
        description: 'The type description for the other organization name of the provider.'
      - name: parent_organization_name
        description: 'The parent organization name of the provider.'
      - name: practice_address_line_1
        description: 'The first line of the practice address.'
      - name: practice_address_line_2
        description: 'The second line of the practice address.'
      - name: practice_city
        description: 'The city of the practice address.'
      - name: practice_state
        description: 'The state of the practice address.'
      - name: practice_zip_code
        description: 'The ZIP code of the practice address.'
      - name: mailing_telephone_number
        description: 'Provider Business Mailing Address Telephone Number.'
      - name: location_telephone_number
        description: 'Provider Business Practice Location Address Telephone Number.'
      - name: official_telephone_number
        description: 'Authorized Official Telephone Number'
      - name: last_updated
        description: 'The date when the provider information was last updated.'
      - name: deactivation_date
        description: 'The date when the provider was deactivated.'
      - name: deactivation_flag
        description: 'Flag indicating if the provider is deactivated.'

  - name: provider_data__medicare_provider_and_supplier_taxonomy_crosswalk
    description: |-
      The Medicare provider and supplier taxonomy crosswalk maps Medicare specialty and supplier categories to
      Healthcare Provider Taxonomy codes. It is maintained by CMS for Medicare enrollment and provider
      classification.
    config:
      meta:
        primary_key_columns:
          - medicare_specialty_code
          - medicare_provider_supplier_type_description
          - provider_taxonomy_code
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "Medicare Provider and Supplier Taxonomy Crosswalk"
          maintainer: "CMS"
          source_url: "https://data.cms.gov/provider-characteristics/medicare-provider-supplier-enrollment/medicare-provider-and-supplier-taxonomy-crosswalk"
          source_release: "CMS Data Medicare Provider and Supplier Taxonomy Crosswalk"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('provider_data','medicare_provider_and_supplier_taxonomy_crosswalk.csv') }}"
      schema: *schema
      alias: medicare_provider_and_supplier_taxonomy_crosswalk
      tags:
        - provider_data
      column_types:
        medicare_specialty_code: *string
        medicare_provider_supplier_type_description: *string
        provider_taxonomy_code: *string
        provider_taxonomy_description: *text

  - name: provider_data__electing_teaching_hospital_list
    description: |-
      The electing teaching hospital list identifies hospitals that are reportable under the CMS Open
      Payments program. It is maintained by CMS Open Payments. Tuva publishes this asset for user-led CMS
      Open Payments and teaching-hospital analytics; current Tuva Core models do not join to it directly.
    config:
      meta:
        data_asset:
          display_name: "Electing Teaching Hospital List"
          maintainer: "CMS Open Payments"
          source_url: "https://www.cms.gov/files/document/copy-2026-reporting-cycle-teaching-hospital-list-october-2025.xlsx"
          source_release: "2026 reporting cycle"
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('provider_data','electing_teaching_hospital_list.csv') }}"
      schema: *schema
      alias: electing_teaching_hospital_list
      tags:
        - provider_data
      column_types:
        collection_year: *string
        ccn: *string
        tin: *string
        hospital_name: *string
        pecos_legal_business_name: *string
        street_address: *string
        po_box: *string
        city: *string
        state: *string
        zip_code: *string
        street_address_1: *string
        street_address_2: *string
        city_2: *string
        state_2: *string
        zip_code_2: *string
    columns:
      - name: collection_year
        description: CMS Open Payments reporting collection year.
      - name: ccn
        description: CMS Certification Number for the teaching hospital.
      - name: tin
        description: Tax Identification Number for the teaching hospital.
      - name: hospital_name
        description: Teaching hospital name.
      - name: pecos_legal_business_name
        description: PECOS legal business name for the teaching hospital.
      - name: street_address
        description: Teaching hospital street address.
      - name: po_box
        description: Teaching hospital post office box, when available.
      - name: city
        description: Teaching hospital city.
      - name: state
        description: Teaching hospital state.
      - name: zip_code
        description: Teaching hospital ZIP code.
      - name: street_address_1
        description: Additional CMS Open Payments address line 1.
      - name: street_address_2
        description: Additional CMS Open Payments address line 2.
      - name: city_2
        description: Additional CMS Open Payments city.
      - name: state_2
        description: Additional CMS Open Payments state.
      - name: zip_code_2
        description: Additional CMS Open Payments ZIP code.

  - name: provider_data__provider_taxonomy_unpivot
    description: |-
      Provider taxonomy unpivot records list one row per NPI and taxonomy relationship so provider specialties
      can be queried directly. They are derived from CMS NPPES provider data.
    config:
      meta:
        primary_key_columns:
          - npi
          - taxonomy_col
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "Provider Taxonomy Unpivot"
          maintainer: "CMS NPPES"
          source_url: "https://download.cms.gov/nppes/NPI_Files.html"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('provider_data','provider_taxonomy_unpivot.csv') }}"
      schema: *schema
      alias: provider_taxonomy_unpivot
      tags:
        - provider_data
      column_types:
        npi: *string
        taxonomy_col: *string
        taxonomy_code: *string
        switch_col: *string
        taxonomy_switch: *string
    columns:
      - name: npi
        description: 'The National Provider Identifier (NPI).'
      - name: taxonomy_col
        description: 'The taxonomy column identifier.'
      - name: taxonomy_code
        description: 'The provider taxonomy code.'
      - name: switch_col
        description: 'The switch column identifier.'
      - name: taxonomy_switch
        description: 'The taxonomy switch value.'
