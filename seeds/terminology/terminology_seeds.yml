version: 2

seeds:
  - name: terminology__act_site
    description: |-
      Act site codes identify anatomical locations involved in a clinical act, such as where a procedure
      was performed or where a medication or immunization was administered. Tuva uses this terminology in
      the core immunization model to translate immunization body site codes into body site descriptions.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__act_site.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: act_site
      tags:
        - terminology
      column_types:
        body_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: body_code
        description: 'The code representing the anatomical location.'
      - name: description
        description: 'A description of the anatomical location.'

  - name: terminology__admit_source
    description: |-
      Admit source codes identify where a patient was admitted from before an institutional stay. Tuva
      sources this terminology from ResDAC variable documentation for Medicare claims data. Tuva uses this
      asset in core encounter models, input normalization models, claims preprocessing service category
      and encounter grouping models, and data quality checks.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__admit_source.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: admit_source
      tags:
        - terminology
        - claims_preprocessing
        - data_profiling
      column_types:
        admit_source_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        admit_source_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        newborn_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: admit_source_code
        description: 'The code representing the source of admission.'
      - name: admit_source_description
        description: 'A description of the admission source.'
      - name: newborn_description
        description: 'Description related to newborn admission. For use when admit type code = 4 (Newborn)'

  - name: terminology__admit_type
    description: |-
      Admit type codes identify the priority, purpose, or category of an institutional admission. Tuva
      sources this terminology from ResDAC variable documentation for Medicare claims data. Tuva uses this
      asset in core encounter models, input normalization models, claims preprocessing service category
      and encounter grouping models, and data quality checks.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__admit_type.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: admit_type
      tags:
        - terminology
        - claims_preprocessing
        - data_profiling
      column_types:
        admit_type_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        admit_type_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: admit_type_code
        description: 'The code representing the type of admission.'
      - name: admit_type_description
        description: 'A description of the admission type.'

  - name: terminology__appointment_cancellation_reason
    description: |-
      Appointment cancellation reason codes identify why a scheduled clinical appointment was cancelled.
      They are maintained by HL7 FHIR and remain available as a terminology reference.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__appointment_cancellation_reason.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: appointment_cancellation_reason
      tags:
        - terminology
      column_types:
        code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: code
        description: 'The code for the cancellation reason.'
      - name: description
        description: 'The description of the cancellation reason code.'

  - name: terminology__appointment_status
    description: |-
      Appointment status codes identify the lifecycle state of a scheduled clinical appointment, such as
      booked, fulfilled, cancelled, or no-show. They are maintained by HL7 FHIR and remain available as a
      terminology reference.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__appointment_status.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: appointment_status
      tags:
        - terminology
      column_types:
        code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: code
        description: 'The code for the appointment status.'

  - name: terminology__appointment_type
    description: |-
      Appointment type codes categorize the purpose or kind of scheduled clinical visit. They are
      maintained by HL7 FHIR and remain available as a terminology reference.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__appointment_type.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: appointment_type
      tags:
        - terminology
      column_types:
        code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: code
        description: 'The code for the appointment type.'
      - name: description
        description: 'The description of the appointment type code.'

  - name: terminology__apr_drg
    description: |-
      APR-DRG codes group inpatient stays by clinical condition, severity of illness, and risk of
      mortality. They are maintained by Solventum. Tuva uses this terminology set to pull in descriptions
      when your claims data uses APR-DRG codes.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__apr_drg.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: apr_drg
      tags:
        - terminology
        - data_profiling
      column_types:
        apr_drg_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        medical_surgical: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        mdc_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        apr_drg_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        deprecated: integer
    columns:
      - name: apr_drg_code
        description: 'The All Patient Refined Diagnosis Related Group (APR-DRG) code.'
      - name: medical_surgical
        description: 'Indicates whether the DRG is medical or surgical.'
      - name: mdc_code
        description: 'The Major Diagnostic Category (MDC) code associated with the APR-DRG.'
      - name: apr_drg_description
        description: 'The description of the All Patient Refined Diagnosis Related Group (APR-DRG).'
      - name: deprecated
        description: 'Indicates whether the APR-DRG code is absent from v43.0 (1) or current in v43.0 (0).'

  - name: terminology__bill_type
    description: |-
      Type of bill codes identify the facility type and bill classification for institutional claims. Tuva
      sources this terminology from ResDAC variable documentation for Medicaid and Medicare claims data.
      Tuva uses this asset in input normalization models, claims preprocessing service category and
      encounter grouping models, and data quality checks.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__bill_type.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: bill_type
      tags:
        - terminology
        - data_profiling
      column_types:
        bill_type_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        bill_type_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        deprecated: integer
        deprecated_date: date
    columns:
      - name: bill_type_code
        description: 'The code representing the type of bill.'
      - name: bill_type_description
        description: 'A description of the billing type.'
      - name: deprecated
        description: 'Indicates if the billing type is deprecated.'
      - name: deprecated_date
        description: 'The date when the billing type code was deprecated.'

  - name: terminology__claim_type
    description: |-
      Claim type values identify whether a claim is professional, institutional, dental, vision, or
      undetermined. They are maintained by Tuva Health for normalized claim processing in Tuva Core. Tuva
      uses these values as the normalized claim_type vocabulary in the input layer, claims preprocessing,
      core claims models, encounter grouping, and data quality logic; current models do not need to join
      to this terminology table to use them.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__claim_type.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: claim_type
      tags:
        - terminology
        - data_profiling
      column_types:
        claim_type: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: claim_type
        description: 'The type of the claim.'

  - name: terminology__cvx
    description: |-
      CVX codes identify vaccines administered in immunization records. They are maintained by the CDC
      National Center for Immunization and Respiratory Diseases. Tuva uses this asset in the core
      immunization model.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__cvx.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: cvx
      tags:
        - terminology
        - data_profiling
      column_types:
        cvx: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        short_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        long_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        status: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        last_updated: date
        deprecated: integer
    columns:
      - name: cvx
        description: 'CVX code, which is a unique identifier for vaccines.'
      - name: short_description
        description: 'Short description of the vaccine.'
      - name: long_description
        description: 'Long description of the vaccine.'
      - name: status
        description: 'Lifecycle status supplied by CDC.'
      - name: last_updated
        description: 'Date the CVX record was last updated by CDC.'
      - name: deprecated
        description: 'Indicates whether CDC marks the CVX code Inactive or Never Active (1) rather than current (0).'

  - name: terminology__discharge_disposition
    description: |-
      Discharge disposition codes identify a patient status or destination at the end of an institutional
      encounter. Tuva sources this terminology from ResDAC variable documentation for Medicare claims
      data. Tuva uses this asset in core encounter models, input normalization models, claims
      preprocessing service category and encounter grouping models, data quality checks, and retained
      readmissions models in the Quality Measures package.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__discharge_disposition.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: discharge_disposition
      column_types:
        discharge_disposition_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        discharge_disposition_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(1024) {%- endif -%}
    columns:
      - name: discharge_disposition_code
        description: 'The code representing the discharge disposition.'
      - name: discharge_disposition_description
        description: 'A description of the discharge disposition.'

  - name: terminology__encounter_type
    description: |-
      Encounter type values classify care settings and encounter categories in Tuva Core. They are
      maintained by Tuva Health. Tuva uses these values as the normalized encounter_type vocabulary in
      core encounter, claims utilization, semantic layer, and downstream utilization analytics; current
      models do not need to join to this terminology table to use them.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__encounter_type.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: encounter_type
      tags:
        - terminology
        - claims_preprocessing
      column_types:
        encounter_group: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        encounter_type: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: encounter_group
        description: 'The group of the encounter.'
      - name: encounter_type
        description: 'The type of the encounter.'

  - name: terminology__ethnicity
    description: |-
      Ethnicity values standardize patient ethnicity reporting in Tuva Core. They are maintained by Tuva
      Health. Tuva uses these values as the expected normalized ethnicity vocabulary for eligibility,
      patient, and data quality logic; current models carry the value through without joining to this
      terminology table.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__ethnicity.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: ethnicity
      tags: terminology
      column_types:
        code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: code
        description: 'The code representing the ethnicity.'
      - name: description
        description: 'A description of the ethnicity.'

  - name: terminology__sex
    description: |-
      Sex values standardize patient sex fields accepted by Tuva Core. They are maintained by Tuva
      Health. Tuva uses these values as the expected normalized sex vocabulary for eligibility, patient,
      and data quality logic; current models carry the value through without joining to this terminology
      table.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__sex.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: sex
      tags:
        - terminology
        - data_profiling
      column_types:
        sex: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
    columns:
      - name: sex
        description: 'The sex value.'

  - name: terminology__hcpcs_level_2
    description: |-
      HCPCS Level II codes identify medical supplies, drugs, ambulance services, durable medical
      equipment, and other non-CPT services. They are maintained by CMS. Tuva uses this asset in the core
      observation model and core procedure models.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__hcpcs_level_2.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: hcpcs_level_2
      tags: terminology
      column_types:
        hcpcs: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        seqnum: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        recid: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        long_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- elif target.type == "snowflake" -%} varchar(16777216) {%- elif target.type in ("fabric", "sqlserver") -%} varchar(max) {%- else -%} varchar(65535) {%- endif -%}
        short_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        deprecated: integer
    columns:
      - name: hcpcs
        description: 'The HCPCS Level II code.'
      - name: seqnum
        description: 'The sequence number.'
      - name: recid
        description: 'The record identifier.'
      - name: long_description
        description: 'The long description of the HCPCS code.'
      - name: short_description
        description: 'The short description of the HCPCS code.'
      - name: deprecated
        description: 'Indicates whether the HCPCS Level II code is terminated or absent from the October 2026 release (1) rather than current (0).'

  - name: terminology__restructured_betos
    description: |-
      Restructured BETOS maps HCPCS and CPT codes to Restructured BETOS Classification System categories
      for grouping Medicare Part B services. It is maintained by CMS. Tuva publishes this asset for
      Medicare service grouping, benchmarking, and downstream analytics; current Tuva Core models do not
      join to it directly.
    config:
      meta:
        primary_key_columns:
          - hcpcs_cd
          - first_rbcs_release_year
        primary_key_strategy: natural_multi_column
      post_hook: "{{ load_versioned_seed('terminology','terminology__restructured_betos.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: restructured_betos
      tags: terminology
      column_types:
        hcpcs_cd: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_id: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_cat: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_cat_desc: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_cat_subcat: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_subcat_desc: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_famnumb: |
          {%- if target.type in ("bigquery", "databricks") -%} numeric {%- elif target.type in ("athena") -%} int {%- else -%} numeric {%- endif -%}
        rbcs_family_desc: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        rbcs_major_ind: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        hcpcs_cd_add_dt: |
          {%- if target.type in ("bigquery", "databricks") -%} date {%- else -%} date {%- endif -%}
        hcpcs_cd_end_dt: |
          {%- if target.type in ("bigquery", "databricks") -%} date {%- else -%} date {%- endif -%}
        rbcs_latest_assignment: integer
        first_rbcs_release_year: integer
        rbcs_analysis_start_dt: date
        rbcs_analysis_end_dt: date
        alt_assignment_method: integer
        rbcs_id_ever_reassigned: integer
    columns:
      - name: hcpcs_cd
        description: HCPCS or CPT code.
      - name: rbcs_id
        description: |
          RBCS identifier which is comprised of 6 characters. The first
          character identifies the category; the second character identifies
          the subcategory; the third, fourth, and fifth characters identify
          the family, and the sixth character identifies whether the service
          is a major procedure.
      - name: rbcs_cat
        description: First character for the RBCS taxonomy ID, which represents the RBCS ID category.
      - name: rbcs_cat_desc
        description: Category description.
      - name: rbcs_cat_subcat
        description: First 2 characters for the RBCS taxonomy ID, which represents the RBCS ID's category and subcategory.
      - name: rbcs_subcat_desc
        description: Subcategory description.
      - name: rbcs_famnumb
        description: Third, fourth, and fifth characters, which represents the RBCS family number.
      - name: rbcs_family_desc
        description: Family description.
      - name: rbcs_major_ind
        description: |
          Sixth character for the RBCS taxonomy ID, which identifies whether
          the HCPCS code is a Major procedure (M), Other (O), or non-procedure
          code (N).
      - name: hcpcs_cd_add_dt
        description: HCPCS Code Effective Date.
      - name: hcpcs_cd_end_dt
        description: HCPCS Code End Date.
      - name: rbcs_latest_assignment
        description: CMS flag where 1 identifies the latest RBCS assignment for the HCPCS code and 0 identifies an earlier assignment.
      - name: first_rbcs_release_year
        description: First RBCS release year in which this assignment appeared.
      - name: rbcs_analysis_start_dt
        description: Beginning of the CMS analysis period for this assignment.
      - name: rbcs_analysis_end_dt
        description: End of the CMS analysis period for this assignment.
      - name: alt_assignment_method
        description: CMS flag indicating use of an alternative assignment method.
      - name: rbcs_id_ever_reassigned
        description: CMS flag indicating whether the HCPCS code has ever been reassigned to another RBCS ID.

  - name: terminology__icd_9_cm
    description: |-
      ICD-9-CM diagnosis codes identify diagnoses in historical claims and clinical data before the U.S.
      transition to ICD-10-CM. They were maintained by CMS and are no longer updated for
      current U.S. reporting. Tuva uses this asset in the core observation model, core condition models,
      core encounter models, claims preprocessing service category and encounter grouping models, and data
      quality checks.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__icd_9_cm.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: icd_9_cm
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_9_cm: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        long_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        short_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        deprecated: integer
    columns:
      - name: icd_9_cm
        description: 'The ICD-9-CM code.'
      - name: long_description
        description: 'The long description of the ICD-9-CM code.'
      - name: short_description
        description: 'The short description of the ICD-9-CM code.'
      - name: deprecated
        description: 'Indicates whether the code is historical and absent from final ICD-9-CM v32 (1) or present in v32 (0).'

  - name: terminology__icd_9_pcs
    description: |-
      ICD-9 procedure codes identify inpatient procedures in historical claims data before the U.S.
      transition to ICD-10-PCS. They were maintained by CMS and are no longer updated for current U.S.
      reporting. Tuva uses this asset in the core observation model, core procedure models, and data
      quality checks.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__icd_9_pcs.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: icd_9_pcs
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_9_pcs: |
