version: 2

anchors:
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(3000) {%- endif -%}
  - &date |
    {%- if target.type in ("bigquery", "databricks") -%} date {%- else -%} date {%- endif -%}
  - &numeric |
    {%- if target.type in ("bigquery", "databricks") -%} numeric {%- elif target.type in ("athena") -%} decimal(38,0) {%- else -%} numeric {%- endif -%}

seeds:
  - name: terminology__act_site
    description: 'This seed contains An anatomical location on a human which can be the focus of an act.'
    config:
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: act_site
      tags:
        - terminology
      column_types:
        body_code: *string
        description: *string
    columns:
      - name: body_code
        description: 'The code representing the anatomical location.'
      - name: description
        description: 'A description of the anatomical location.'

  - name: terminology__admit_source
    description: 'NUBC Admit Sources'
