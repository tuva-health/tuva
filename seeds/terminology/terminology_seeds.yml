      for procedure coding, billing, grouping, and analytics and are maintained by CMS. This table includes
      the current CMS ICD-10-PCS code set and historical ICD-10-PCS codes retained by AHRQ PRCCSR so
      older claims can still be validated and grouped. Tuva uses this asset in the core observation model,
      core procedure models, data quality checks, and readmissions models.
    config:
      meta:
        primary_key_columns:
          - icd_10_pcs
        primary_key_strategy: natural_single_column
        data_asset:
          display_name: "ICD-10-PCS"
          maintainer: "CMS"
          source_url: "https://www.cms.gov/medicare/coding-billing/icd-10-codes"
          source_release: "FY 2026 April 1, 2026 update; AHRQ PRCCSR v2026.1 historical coverage"
          source_last_updated: "2026-03-10"
          tuva_last_updated: "2026-05-27"
          update_frequency: "annually"
          notes: "Includes current CMS April 1, 2026 ICD-10-PCS codes plus historical ICD-10-PCS codes retained by AHRQ PRCCSR v2026.1. Deprecated is 1 when the code is no longer active in the current CMS code file."
      post_hook: "{{ load_versioned_seed('terminology','icd_10_pcs.csv') }}"
      schema: *schema
      alias: icd_10_pcs
      tags:
