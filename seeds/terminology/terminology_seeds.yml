  - name: terminology__snomed_ct_transitive_closures
    description: |-
      SNOMED CT transitive closures expand the concept hierarchy so descendants and ancestors can be
      queried directly. They are derived from SNOMED CT, which is maintained by SNOMED International and
      distributed in the U.S. by the National Library of Medicine. Tuva publishes this asset for user-led
      SNOMED CT hierarchy analysis and downstream clinical concept expansion; current Tuva Core models do
      not join to it directly.
    config:
      meta:
        primary_key_columns:
          - parent_snomed_code
          - child_snomed_code
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "SNOMED CT Transitive Closures"
          maintainer: "National Library of Medicine"
          source_url: "https://www.nlm.nih.gov/healthit/snomedct/us_edition.html"
          source_release: ""
