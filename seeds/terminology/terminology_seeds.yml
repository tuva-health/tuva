      column_types:
        ms_drg: *string
        fiscal_year: *string
        final_post_acute_drg: *string
        final_special_pay_drg: *string
        mdc: *string
        type: *string
        ms_drg_title: *string
        drg_weight_raw: *string
        drg_weight: *string
        geometric_mean_los: *string
        arithmetic_mean_los: *string
    columns:
      - name: ms_drg
        description: 'The Medicare Severity Diagnosis Related Group (MS-DRG) code.'
      - name: fiscal_year
        description: 'Fiscal year for the DRG weight and LOS values.'
      - name: final_post_acute_drg
        description: 'Indicates if this is a final post-acute DRG for the given year.'
