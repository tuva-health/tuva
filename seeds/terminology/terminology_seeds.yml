  - name: terminology__icd10_pcs_cms_ontology
    description: |-
      The ICD-10-PCS CMS ontology decomposes procedure codes into their positional components, including
      section, body system, root operation, body part, approach, device, and qualifier. It is maintained
      by CMS. Tuva uses this asset in AHRQ CCSR models.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__icd10_pcs_cms_ontology.csv.gz') }}"
      schema: |
        {%- if var('tuva_schema_prefix', None) != None -%}{{ var('tuva_schema_prefix') }}_terminology{% else %}terminology{%- endif -%}
      alias: icd10_pcs_cms_ontology
      tags:
        - terminology
      column_types:
        icd10pcs_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        section: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        body_system: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        operation: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        body_part: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        approach: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        device: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        qualifier: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        deprecated: integer
    columns:
      - name: icd10pcs_code
        description: ICD-10-PCS code
      - name: section
        description: The "section" is associated with the first character of the ICD-10-PCS code.
      - name: body_system
        description: Body system associated with the ICD-10-PCS code; corresponds to the second character of the code.
      - name: operation
        description: Root operation associated with the ICD-10-PCS code; corresponds to the third character of the code
      - name: body_part
        description: Body part associated with the ICD-10-PCS code; corresponds to the fourth character of the code
      - name: approach
        description: Approach associated with the ICD-10-PCS code; corresponds to the fifth character of the code
      - name: device
        description: Device associated with the ICD-10-PCS code; corresponds to the sixth character of the code
      - name: qualifier
        description: Qualifier associated with the ICD-10-PCS code; corresponds to the seventh character of the code
      - name: deprecated
        description: Indicates whether the ICD-10-PCS code is absent from FY 2027 (1) or current in FY 2027 (0).

  - name: terminology__ssa_fips_state_county_crosswalk
    description: |-
      The SSA-FIPS state and county crosswalk maps Social Security Administration county codes to FIPS
      county identifiers for Medicare geographic analytics. It is maintained by the National Bureau of
      Economic Research from federal reference data. Tuva publishes this asset for Medicare geographic
      enrichment and user-led SSA-to-FIPS crosswalks; current Tuva Core models do not join to it directly.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__ssa_fips_state_county_crosswalk.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: ssa_fips_state_county_crosswalk
      tags:
        - terminology
      column_types:
        fipscounty: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(5) {%- endif -%} 
        countyname_fips: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%} 
        state: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(2) {%- endif -%} 
        cbsa_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(5) {%- endif -%} 
        cbsa_name: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%} 
        ssa_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(5) {%- endif -%} 
        state_name: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(64) {%- endif -%} 
        countyname_rate: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(128) {%- endif -%} 
    columns:
      - name: fipscounty
        description: 'Five-character Federal Information Processing Standards (FIPS) state and county code when available, preserving leading zeros.'
      - name: countyname_fips
        description: 'County or county-equivalent name associated with the FIPS code when available.'
      - name: state
        description: 'Two-character U.S. postal abbreviation supplied by the source when available.'
      - name: cbsa_code
        description: 'Five-character Core-Based Statistical Area (CBSA) code assigned by CMS; null when the county is not assigned to a CBSA.'
      - name: cbsa_name
        description: 'Name of the Core-Based Statistical Area associated with the CBSA code; null when the county is not assigned to a CBSA.'
      - name: ssa_code
        description: 'Five-character Social Security Administration state and county code from the Medicare Advantage Ratebook when available, preserving leading zeros.'
      - name: state_name
        description: 'State or territory name from the Medicare Advantage Ratebook when available.'
      - name: countyname_rate
        description: 'County name from the Medicare Advantage Ratebook associated with the SSA code when available.'

