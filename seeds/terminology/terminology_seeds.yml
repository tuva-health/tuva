  - name: terminology__icd_10_cm
    description: 'Seed containing ICD-10-CM codes and descriptions.'
    config:
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: icd_10_cm
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_10_cm: *string
        billable_code_flag: *string
        short_description: *string
        long_description: *string
    columns:
      - name: icd_10_cm
        description: 'Alpha-Numeric ICD-10-CM Code.'
      - name: billable_code_flag
        description: 'Indicates a diagnosis is billable with a 1. A value of 1 means the code IS billable for HIPAA covered entities and is a valid diagnosis code. A value of 0 indicates the code IS NOT billable for HIPAA covered entities, and is included in the ICD-10-CM listing for organizational purposes. It should be uncommon for codes in claims or clinical data sources to contain header values, but if you want to ensure you are not capturing non-billable codes, filter out all codes from this table where billable_code_flag = 0'
      - name: short_description
        description: 'The short description of the ICD-10-CM code.'
      - name: long_description
        description: 'The long description of the ICD-10-CM code.'

  - name: terminology__icd_10_pcs
