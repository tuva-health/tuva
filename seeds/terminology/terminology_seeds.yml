      SNOMED CT concepts identify clinical findings, disorders, procedures, body structures, organisms,
      and other clinical meanings. SNOMED CT is maintained by SNOMED International, and the U.S. Edition
      is distributed by the National Library of Medicine. Tuva uses this asset in the core lab result
      model, the core observation model, core procedure models, and core condition models.
    config:
      meta:
        data_asset:
          display_name: "SNOMED CT"
