          source_url: "https://www.solventum.com/en-us/home/health-information-technology/resources-education/available-resources/"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','apr_drg.csv') }}"
      schema: *schema
