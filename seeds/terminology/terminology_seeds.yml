  - name: terminology__loinc
    description: |-
      LOINC codes identify laboratory tests, clinical measurements, survey instruments, and other
      observations. They are maintained by the Regenstrief Institute and used to standardize lab and
      observation data. Tuva uses this asset in the core lab result model and the core observation model.
    config:
      meta:
        data_asset:
          display_name: "LOINC"
          maintainer: "Regenstrief Institute"
          source_url: "https://loinc.org/downloads/"
          source_release: "LOINC 2.82"
          source_last_updated: "2026-02-24"
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
          license_url: "https://loinc.org/license/"
      post_hook: "{{ load_versioned_seed('terminology','loinc.csv') }}"
      schema: *schema
      alias: loinc
      tags:
        - terminology
      column_types:
        loinc: *string
        short_name: *string
        long_common_name: *string
        component: *string
        property: *string
        time_aspect: *string
        system: *string
        scale_type: *string
        method_type: *string
        class_code: *string
        class_description: *string
        class_type_code: *string
        class_type_description: *string
        paneltype: *string
        order_obs: *string
        example_units: *string
        external_copyright_notice: *text
        status: *string
        version_first_released: *string
        version_last_changed: *string
    columns:
      - name: loinc
        description: 'The LOINC code.'
      - name: short_name
        description: 'If exists, the short human-readable version of the LOINC description.'
      - name: long_common_name
        description: 'Clinician-friendly full LOINC description.'
      - name: component
        description: 'The substance or entity being measured or observed. Also called the Analyte. The first of six LOINC parts.'
      - name: property
        description: 'The characteristic or attribute of the analyte. The second of six LOINC parts.'
      - name: time_aspect
        description: 'The interval of time over which an observation was made. The third of six LOINC parts.'
      - name: system
        description: 'The thing upon which the observation was made. Also called specimen for laboratory tests. The fourth of six LOINC parts.'
      - name: scale_type
        description: 'How the observation value is quantified or expressed (e.g. quantitative, ordinal, nominal, etc.). The fifth of six LOINC parts.'
      - name: method_type
        description: 'A high-level classification of how the observation was made. Optional; only needed when the technique affects the clinical interpretation of the results. The sixth of six LOINC parts.'
      - name: class_code
        description: 'A code representing the general category of the LOINC term.'
      - name: class_description
        description: 'The general category of the LOINC term.'
      - name: class_type_code
        description: 'A code representing the top-level category for the test.'
      - name: class_type_description
        description: 'The top-level category for the test; Laboratory, Clinical, Claims attachments, or Surveys.'
      - name: paneltype
        description: 'The LOINC panel type for the term. This is blank for terms that are not panels.'
      - name: order_obs
        description: 'The LOINC Order/Observation flag indicating whether the term is intended for ordering, observation, or both.'
      - name: example_units
        description: 'Example units of measure published by Regenstrief for the LOINC term.'
      - name: external_copyright_notice
        description: External copyright holder's copyright notice for this LOINC code.
      - name: status
        description: 'The status of the LOINC code concept. Active, Trial (experimental), Discouraged (not recommended), or Deprecated (should not be used).'
      - name: version_first_released
        description: 'The first release version of LOINC that included this code.'
      - name: version_last_changed
        description: 'The last LOINC version in which this record was changed.'

  - name: terminology__loinc_deprecated_mapping
    description: |-
      LOINC deprecated mappings identify replacement or successor terms for deprecated LOINC codes. They
