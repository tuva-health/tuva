          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','encounter_type.csv') }}"
      schema: *schema
