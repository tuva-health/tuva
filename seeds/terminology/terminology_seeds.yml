version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &schema  - target schema for this data asset family
#   &string  - short codes and identifiers
#   &text    - long free text
#   &date    - calendar date
#   &integer - whole number
#   &numeric - exact numeric
anchors:
  - &schema |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(3000)
    {%- endif -%}
  - &date date
  - &integer integer
  - &numeric |
    {%- if target.type == "athena" -%} decimal(38,0)
    {%- else -%} numeric
    {%- endif -%}

seeds:
  - name: terminology__act_site
    description: |-
      Act site codes identify anatomical locations involved in a clinical act, such as where a procedure
      was performed or where a medication or immunization was administered. Tuva uses this terminology in
      the core immunization model to translate immunization body site codes into body site descriptions.
    config:
      meta:
        data_asset:
          maintainer: "Health Level Seven International"
          source_url: "https://terminology.hl7.org/CodeSystem-v3-ActSite.html"
          source_release: "HL7 Terminology v7.1.0; ActSite CodeSystem v4.0.0"
          source_last_updated: "2019-03-20"
          tuva_last_updated: "2026-05-23"
          update_frequency: "ad hoc"
          license_url: "https://terminology.hl7.org/license.html"
          notes: "Tuva uses this terminology in the core immunization model to translate immunization body site codes into body site descriptions."
      post_hook: "{{ load_versioned_seed('terminology','act_site.csv') }}"
      schema: *schema
      alias: act_site
      tags:
        - terminology
      column_types:
        body_code: *string
        description: *string
    columns:
      - name: body_code
        description: 'The code representing the anatomical location.'
      - name: description
        description: 'A description of the anatomical location.'

  - name: terminology__admit_source
    description: |-
      Admit source codes identify where a patient was admitted from before an institutional stay. Tuva
      sources this terminology from ResDAC variable documentation for Medicare claims data. Tuva uses this
      asset in core encounter models, input normalization models, claims preprocessing service category
      and encounter grouping models, and data quality checks.
    config:
      meta:
        data_asset:
          maintainer: "ResDAC"
          source_url: "https://resdac.org/cms-data/variables/claim-source-inpatient-admission-code-ffs"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','admit_source.csv') }}"
      schema: *schema
      alias: admit_source
      tags:
        - terminology
        - claims_preprocessing
        - data_profiling
      column_types:
        admit_source_code: *string
        admit_source_description: *string
        newborn_description: *string
    columns:
      - name: admit_source_code
        description: 'The code representing the source of admission.'
      - name: admit_source_description
        description: 'A description of the admission source.'
      - name: newborn_description
        description: 'Description related to newborn admission. For use when admit type code = 4 (Newborn)'

