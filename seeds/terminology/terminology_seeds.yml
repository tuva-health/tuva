  - name: terminology__snomed_ct
    description: |-
      SNOMED CT concepts identify clinical findings, disorders, procedures, body structures, organisms,
      and other clinical meanings. SNOMED CT is maintained by SNOMED International, and the U.S. Edition
      is distributed by the National Library of Medicine. Tuva uses this asset in the core lab result
      model, the core observation model, core procedure models, core condition models, and logical data
      quality checks. The March 2026 U.S. Edition is merged with every concept from the prior Tuva
      snapshot so historical source codes continue to resolve. The description remains the current
      fully specified name (FSN), preserving the public column's established semantics.
    config:
      meta:
        primary_key_columns:
          - snomed_ct
        primary_key_strategy: natural_single_column
      post_hook: "{{ load_versioned_seed('terminology','terminology__snomed_ct.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: snomed_ct
      tags:
        - terminology
      column_types:
        snomed_ct: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4096) {%- endif -%}
        is_active: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        created: date
        last_updated: date
        deprecated: integer
    columns:
      - name: snomed_ct
        description: 'The SNOMED CT code.'
      - name: description
        description: 'The active fully specified name (FSN) when available, otherwise the latest inactive FSN from the March 2026 U.S. Edition; prior-only concepts retain their previously published description.'
      - name: is_active
        description: 'Indicates if the SNOMED CT code is active.'
      - name: created
        description: 'The date when the SNOMED CT code was created.'
      - name: last_updated
        description: 'The date when the SNOMED CT code was last updated.'
      - name: deprecated
        description: 'Indicates whether the concept is inactive in the March 2026 U.S. Edition or retained only from the prior Tuva snapshot (1), rather than active in March 2026 (0).'


  - name: terminology__snomed_ct_transitive_closures
    description: |-
      SNOMED CT transitive closures expand the concept hierarchy so descendants and ancestors can be
      queried directly. SNOMED International maintains SNOMED CT, and the National Library of Medicine
      distributes the U.S. Edition and its transitive closure resources. Tuva publishes the coordinated
      March 2026 closure snapshot for user-led SNOMED CT hierarchy analysis and downstream clinical
      concept expansion; current Tuva Core models do not join to it directly. The relation is reflexive:
      every retained concept has one self-edge in addition to the current official ancestor edges. Prior
      non-reflexive hierarchy edges are not appended to the current relationship snapshot.
    config:
      meta:
        primary_key_columns:
          - parent_snomed_code
          - child_snomed_code
        primary_key_strategy: natural_multi_column
      post_hook: "{{ load_versioned_seed('terminology','terminology__snomed_ct_transitive_closures.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: snomed_ct_transitive_closures
      tags:
        - terminology
      column_types:
        parent_snomed_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        parent_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4096) {%- endif -%}
        child_snomed_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        child_description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4096) {%- endif -%}
    columns:
      - name: parent_snomed_code
        description: 'The SNOMED code of the parent concept.'
      - name: parent_description
        description: 'The description of the parent SNOMED concept.'
      - name: child_snomed_code
        description: 'The SNOMED code of the child concept.'
      - name: child_description
        description: 'The description of the child SNOMED concept.'


