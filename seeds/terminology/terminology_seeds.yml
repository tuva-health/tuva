      Tract-level Social Vulnerability Index records measure social risk factors used for geography-based
      population health analytics. They are maintained by CDC/ATSDR. Tuva publishes this asset for
      tract-level social vulnerability enrichment and population health analytics; current Tuva Core
      models do not join to it directly.
