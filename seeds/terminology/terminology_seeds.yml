  - name: terminology__hcpcs_level_2
    description: |-
      HCPCS Level II codes identify medical supplies, drugs, ambulance services, durable medical
      equipment, and other non-CPT services. They are maintained by CMS. Tuva uses this asset in the core
      observation model and core procedure models.
    config:
      meta:
        data_asset:
          display_name: "HCPCS Level II"
          maintainer: "CMS"
          source_url: "https://www.cms.gov/medicare/coding-billing/healthcare-common-procedure-system/quarterly-update"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "quarterly"
      post_hook: "{{ load_versioned_seed('terminology','hcpcs_level_2.csv') }}"
      schema: *schema
      alias: hcpcs_level_2
      tags:
        - terminology
      column_types:
        hcpcs: *string
        seqnum: *string
        recid: *string
        long_description: *text
        short_description: *string
    columns:
      - name: hcpcs
        description: 'The HCPCS Level II code.'
      - name: seqnum
        description: 'The sequence number.'
      - name: recid
        description: 'The record identifier.'
      - name: long_description
        description: 'The long description of the HCPCS code.'
      - name: short_description
        description: 'The short description of the HCPCS code.'

  - name: terminology__restructured_betos
    description: |-
      Restructured BETOS maps HCPCS and CPT codes to Restructured BETOS Classification System categories
      for grouping Medicare Part B services. It is maintained by CMS. Tuva publishes this asset for
      Medicare service grouping, benchmarking, and downstream analytics; current Tuva Core models do not
      join to it directly.
    config:
      meta:
        data_asset:
          display_name: "Restructured BETOS"
          maintainer: "CMS"
          source_url: "https://data.cms.gov/provider-summary-by-type-of-service/provider-service-classifications/restructured-betos-classification-system-rbcs"
          source_release: "CMS Data RBCS public use file"
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','restructured_betos.csv') }}"
      schema: *schema
      alias: restructured_betos
      tags:
        - terminology
      enabled: "{{ (var('claims_enabled', False) | string | lower) == 'true' }}"
      column_types:
        hcpcs_cd: *string
        rbcs_id: *string
        rbcs_cat: *string
        rbcs_cat_desc: *string
        rbcs_cat_subcat: *string
        rbcs_subcat_desc: *string
        rbcs_famnumb: *numeric
        rbcs_family_desc: *string
        rbcs_major_ind: *string
        hcpcs_cd_add_dt: *date
        hcpcs_cd_end_dt: *date
        rbcs_assignment_eff_dt: *date
        current_flag: *numeric
    columns:
      - name: hcpcs_cd
        description: HCPCS or CPT code.
      - name: rbcs_id
        description: |
          RBCS identifier which is comprised of 6 characters. The first
          character identifies the category; the second character identifies
          the subcategory; the third, fourth, and fifth characters identify
          the family, and the sixth character identifies whether the service
          is a major procedure.
      - name: rbcs_cat
        description: First character for the RBCS taxonomy ID, which represents the RBCS ID category.
      - name: rbcs_cat_desc
        description: Category description.
      - name: rbcs_cat_subcat
        description: First 2 characters for the RBCS taxonomy ID, which represents the RBCS ID's category and subcategory.
      - name: rbcs_subcat_desc
        description: Subcategory description.
      - name: rbcs_famnumb
        description: Third, fourth, and fifth characters, which represents the RBCS family number.
      - name: rbcs_family_desc
        description: Family description.
      - name: rbcs_major_ind
        description: |
          Sixth character for the RBCS taxonomy ID, which identifies whether
          the HCPCS code is a Major procedure (M), Other (O), or non-procedure
          code (N).
      - name: hcpcs_cd_add_dt
        description: HCPCS Code Effective Date.
      - name: hcpcs_cd_end_dt
        description: HCPCS Code End Date.
      - name: rbcs_assignment_eff_dt
        description: Provides users with the earliest date that the RBCS ID is effective.
      - name: current_flag
        description: Flag where 1 = the current version of the RBCS for that particular HCPCS_CD, 0 = old version.

  - name: terminology__icd_9_cm
    description: |-
      ICD-9-CM diagnosis codes identify diagnoses in historical claims and clinical data before the U.S.
      transition to ICD-10-CM. They were maintained by CMS and are no longer updated for
      current U.S. reporting. Tuva uses this asset in the core observation model, core condition models,
      core encounter models, claims preprocessing service category and encounter grouping models, and data
      quality checks.
    config:
      meta:
        data_asset:
          display_name: "ICD-9-CM"
          maintainer: "CMS"
          source_url: "https://www.cms.gov/medicare/coding-billing/icd-10-codes/icd-9-cm-diagnosis-procedure-codes-abbreviated-and-full-code-titles"
          source_release: "Historical ICD-9"
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "static"
      post_hook: "{{ load_versioned_seed('terminology','icd_9_cm.csv') }}"
      schema: *schema
      alias: icd_9_cm
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_9_cm: *string
        long_description: *string
        short_description: *string
    columns:
      - name: icd_9_cm
        description: 'The ICD-9-CM code.'
      - name: long_description
        description: 'The long description of the ICD-9-CM code.'
      - name: short_description
        description: 'The short description of the ICD-9-CM code.'

  - name: terminology__icd_9_pcs
    description: |-
      ICD-9 procedure codes identify inpatient procedures in historical claims data before the U.S.
      transition to ICD-10-PCS. They were maintained by CMS and are no longer updated for current U.S.
      reporting. Tuva uses this asset in the core observation model, core procedure models, and data
      quality checks.
    config:
      meta:
        data_asset:
          display_name: "ICD-9-PCS"
          maintainer: "CMS"
          source_url: "https://www.cms.gov/medicare/coding-billing/icd-10-codes/icd-9-cm-diagnosis-procedure-codes-abbreviated-and-full-code-titles"
          source_release: "Historical ICD-9"
          source_last_updated: ""
          tuva_last_updated: "2026-04-29"
          update_frequency: "static"
      post_hook: "{{ load_versioned_seed('terminology','icd_9_pcs.csv') }}"
      schema: *schema
      alias: icd_9_pcs
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_9_pcs: *string
        long_description: *string
        short_description: *string
    columns:
      - name: icd_9_pcs
        description: 'The ICD-9-PCS code.'
      - name: long_description
        description: 'The long description of the ICD-9-PCS code.'
      - name: short_description
        description: 'The short description of the ICD-9-PCS code.'
  - name: terminology__icd_10_cm
    description: |-
      ICD-10-CM codes identify specific diseases, symptoms, injuries, and other health conditions. They
      are used for diagnosis coding, billing, cohorting, quality measurement, and risk adjustment and are
      sourced by Tuva from CMS ICD-10-CM files. Tuva uses this asset in the core observation model, core
      condition models, core encounter models, claims preprocessing service category and encounter
      grouping models, data quality checks, and readmissions models.
    config:
      meta:
        data_asset:
          display_name: "ICD-10-CM"
          maintainer: "CMS"
          source_url: "https://www.cms.gov/medicare/coding-billing/icd-10-codes"
          source_release: "FY 2026"
          source_last_updated: "2025-12-17"
          tuva_last_updated: "2026-04-29"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('terminology','icd_10_cm.csv') }}"
      schema: *schema
      alias: icd_10_cm
      tags:
        - terminology
        - claims_preprocessing
        - readmissions
        - data_profiling
      column_types:
        icd_10_cm: *string
        billable_code_flag: *string
        short_description: *string
        long_description: *string
    columns:
      - name: icd_10_cm
        description: 'Alpha-Numeric ICD-10-CM Code.'
      - name: billable_code_flag
        description: 'Indicates a diagnosis is billable with a 1. A value of 1 means the code IS billable for HIPAA covered entities and is a valid diagnosis code. A value of 0 indicates the code IS NOT billable for HIPAA covered entities, and is included in the ICD-10-CM listing for organizational purposes. It should be uncommon for codes in claims or clinical data sources to contain header values, but if you want to ensure you are not capturing non-billable codes, filter out all codes from this table where billable_code_flag = 0'
      - name: short_description
        description: 'The short description of the ICD-10-CM code.'
      - name: long_description
        description: 'The long description of the ICD-10-CM code.'

  - name: terminology__icd_10_pcs
    description: |-
