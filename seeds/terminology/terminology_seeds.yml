      - name: description
        description: 'The description of the ICD-10-PCS code.'
      - name: deprecated
        description: 'Indicates whether the ICD-10-PCS code is no longer active in the current CMS code file. A value of 1 means the code is deprecated; a value of 0 means the code is active.'

