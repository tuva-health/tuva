          source_release: "LOINC 2.82"
          source_last_updated: "2026-02-24"
          tuva_last_updated: "2026-04-29"
          update_frequency: "ad hoc"
          license_url: "https://loinc.org/license/"
      post_hook: "{{ load_versioned_seed('terminology','loinc_deprecated_mapping.csv') }}"
      schema: *schema
      alias: loinc_deprecated_mapping
      tags:
        - terminology
      column_types:
        loinc: *string
        map_to: *string
        comment: *string
        final_map_to: *string
        all_comments: *string
        depth: *string
    columns:
      - name: loinc
        description: 'The deprecated term to which the replacement term(s) apply.'
      - name: map_to
        description: 'A replacement term that is to be used in place of the deprecated or discouraged term.'
      - name: comment
        description: 'Narrative text that explains the rationale for using the recommended replacement term.'
      - name: final_map_to
        description: 'If there are multiple steps of deprecated codes, this is the final (active) code.'
      - name: all_comments
        description: 'An aggregation of comments for any mapping steps between the deprecated code and the active code.'
      - name: depth
        description: 'How many steps this mapping is to the active code.'

