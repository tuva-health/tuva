  - name: terminology__calendar
    description: |-
      The calendar table is a public daily reference asset with common date attributes maintained by Tuva Health. Tuva Core preserves it for compatible downstream use, including the Semantic Layer, CMS HCC, and AHRQ Quality Indicators. Core normalization, member-month construction, and provider attribution do not use calendar membership to validate or erase already-typed dates; member-month processing uses a separate package-owned monthly spine.
    config:
      post_hook: "{{ load_versioned_seed('terminology','terminology__calendar.csv.gz') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
      alias: calendar
      tags:
        - terminology
      column_types:
        full_date: date
        year: integer
        month: integer
        day: integer
        month_name: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        day_of_week_number: integer
        day_of_week_name: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        week_of_year: integer
        day_of_year: integer
        year_month: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        first_day_of_month: date
        last_day_of_month: date
        year_month_int: integer

    columns:
      - name: full_date
        description: 'The complete date.'
      - name: year
        description: 'The year part of the date.'
      - name: month
        description: 'The month part of the date.'
      - name: day
        description: 'The day part of the date.'
      - name: month_name
        description: 'The name of the month.'
      - name: day_of_week_number
        description: 'The number of the day in the week.'
      - name: day_of_week_name
        description: 'The name of the day in the week.'
      - name: week_of_year
        description: 'The week number in the year.'
      - name: day_of_year
        description: 'The day number in the year.'
      - name: year_month
        description: 'The year and month in YYYY-MM format.'
      - name: first_day_of_month
        description: 'The first day of the month.'
      - name: last_day_of_month
        description: 'The last day of the month.'

