version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &schema  - target schema for this data asset family
#   &string  - short codes and identifiers
#   &date    - calendar date
#   &integer - whole number
anchors:
  - &schema |
    {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_terminology{% else %}terminology{%- endif -%}
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &date date
  - &integer integer

seeds:
  - name: terminology__ansi_fips_state
    description: |-
      ANSI FIPS state records standardize state FIPS codes, abbreviations, and names for geography
      normalization. They are maintained by the U.S. Census Bureau and ANSI/INCITS. Tuva uses this asset
      in input normalization models.
    config:
      meta:
        data_asset:
          maintainer: "U.S. Census Bureau and ANSI/INCITS"
          source_url: "https://www2.census.gov/geo/docs/reference/codes2020/national_state2020.txt"
          source_release: "2020 Census state national codes file"
          source_last_updated: "2023-02-13"
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','ansi_fips_state.csv') }}"
      schema: *schema
      alias: ansi_fips_state
      tags:
        - terminology
        - medicare_cclf_connector
      column_types:
        ansi_fips_state_code: *string
        ansi_fips_state_abbreviation: *string
        ansi_fips_state_name: *string
    columns:
      - name: ansi_fips_state_code
        description: 'The unique ANSI FIPS state code.'
      - name: ansi_fips_state_abbreviation
        description: 'The abbreviation of the ANSI FIPS state.'
      - name: ansi_fips_state_name
        description: 'The full name of the ANSI FIPS state.'

  - name: terminology__calendar
    description: |-
      The calendar table provides a date spine and common date attributes used for joins, date
      normalization, and month-level analytics. It is maintained by Tuva Health. Tuva uses this asset in
      core member month models, input normalization models, provider attribution models, semantic layer
      models, CMS-HCC models, and AHRQ quality indicator models.
    config:
      meta:
        data_asset:
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','calendar.csv') }}"
      schema: *schema
      alias: calendar
      tags:
        - terminology
        - pmpm
      column_types:
        full_date: *date
        year: *integer
        month: *integer
        day: *integer
        month_name: *string
        day_of_week_number: *integer
        day_of_week_name: *string
        week_of_year: *integer
        day_of_year: *integer
        year_month: *string
        first_day_of_month: *date
        last_day_of_month: *date
        year_month_int: *integer

    columns:
      - name: full_date
        description: 'The complete date.'
      - name: year
        description: 'The year part of the date.'
      - name: month
        description: 'The month part of the date.'
      - name: day
        description: 'The day part of the date.'
      - name: month_name
        description: 'The name of the month.'
      - name: day_of_week_number
        description: 'The number of the day in the week.'
      - name: day_of_week_name
        description: 'The name of the day in the week.'
      - name: week_of_year
        description: 'The week number in the year.'
      - name: day_of_year
        description: 'The day number in the year.'
      - name: year_month
        description: 'The year and month in YYYY-MM format.'
      - name: first_day_of_month
        description: 'The first day of the month.'
      - name: last_day_of_month
        description: 'The last day of the month.'
      - name: year_month_int
        description: 'Year and month expressed as an integer in YYYYMM format.'

  - name: terminology__code_type
    description: |-
      Code type values identify coding systems used across Tuva Core, such as ICD-10-CM, ICD-10-PCS,
      HCPCS, NDC, LOINC, and SNOMED CT. They are maintained by Tuva Health. Tuva uses these values as the
      expected vocabulary for code_type fields across input, core, and downstream models; current models
      carry the value through without joining to this reference table.
    config:
      meta:
        data_asset:
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','code_type.csv') }}"
      schema: *schema
      alias: code_type
      tags:
        - terminology
        - data_profiling
      column_types:
        code_type: *string
    columns:
      - name: code_type
        description: 'The type of the code.'

  - name: terminology__fips_county
    description: |-
      FIPS county records standardize county codes and names for geographic enrichment. They are
      maintained by the U.S. Census Bureau. Tuva publishes this asset for county-level geographic
      enrichment and user-led population health analytics; current Tuva Core models do not join to it
      directly.
    config:
      meta:
        data_asset:
          maintainer: "U.S. Census Bureau and ANSI/INCITS"
          source_url: "https://www2.census.gov/geo/docs/reference/codes2020/national_county2020.txt"
          source_release: "2020 Census county national codes file"
          source_last_updated: "2023-02-13"
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','fips_county.csv') }}"
      schema: *schema
      alias: fips_county
      tags:
        - terminology
      column_types:
        fips_code: *string
        county: *string
        state: *string
    columns:
      - name: fips_code
        description: 'The FIPS code for the county.'
      - name: county
        description: 'The name of the county.'
      - name: state
        description: 'The state where the county is located.'

  - name: terminology__ssa_fips_state
    description: |-
      SSA-FIPS state records map Social Security Administration state codes to state names for Medicare
      geographic normalization. They are maintained by Tuva Health from federal SSA and FIPS reference
      data. Tuva publishes this asset for Medicare geographic normalization and user-led SSA state-code
      crosswalks; current Tuva Core models do not join to it directly.
    config:
      meta:
        data_asset:
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('terminology','ssa_fips_state.csv') }}"
      schema: *schema
      alias: ssa_fips_state
      tags:
        - terminology
      column_types:
        ssa_fips_state_code: *string
        ssa_fips_state_name: *string
    columns:
      - name: ssa_fips_state_code
        description: 'The SSA FIPS state code.'
      - name: ssa_fips_state_name
        description: 'The name of the SSA FIPS state.'

  - name: terminology__svi_us_county
