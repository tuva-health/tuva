version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &string - short codes and identifiers
#   &text   - long free text
#   &date   - calendar date
anchors:
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(3000)
    {%- endif -%}
  - &date date

seeds:
  - name: tuva_condition_grouper
    description: |-
      The Tuva Condition Grouper defines the condition hierarchy used to classify normalized diagnosis records in core.condition. Each row represents one mutually exclusive condition and its parent condition family.
    config:
      meta:
        primary_key_columns:
          - condition_family
          - condition
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "Tuva Condition Grouper"
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: "Tuva Condition Grouper v1"
          source_last_updated: "2026-05-26"
          tuva_last_updated: "2026-05-26"
          update_frequency: "ad hoc"
          notes: "Source of truth is the Tuva Conditions & Procedures Google Sheet."
      post_hook: "{{ load_versioned_seed('value_sets','tuva_condition_grouper.csv') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: tuva_condition_grouper
      tags:
        - value_sets
        - condition_grouper
      column_types:
        condition_family: *string
        condition: *string
        status: *string
        description: *text
        last_update_date: *date
        last_update_note: *text
    columns:
      - name: condition_family
        description: Analytic rollup family for the condition, such as Cardiovascular Disease, Cancer, or Mental Health Disorders.
        tests:
          - not_null
      - name: condition
        description: Mutually exclusive condition name assigned by the Tuva Condition Grouper.
        tests:
          - not_null
      - name: status
        description: Governance status of the condition row. Active rows are available for use in Tuva Condition Grouper mappings.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: description
        description: Human-readable description of the condition and its placement in the condition family.
      - name: last_update_date
        description: Date this condition row was last reviewed or updated.
      - name: last_update_note
        description: Short note describing the reason for the most recent update to the condition row.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - condition_family
              - condition

  - name: tuva_condition_grouper_code_map
    description: |-
      The Tuva Condition Grouper Code Map assigns supported diagnosis codes to exactly one Tuva condition. The code_system and code columns form the primary key and join to code_system and normalized_code in core.condition. Tuva currently supports ICD-10-CM and SNOMED CT diagnosis mappings; unsupported condition code systems remain null in core.condition.
    config:
      meta:
        primary_key_columns:
          - code_system
          - code
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "Tuva Condition Grouper Code Map"
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: "Tuva Condition Grouper v1"
          source_last_updated: "2026-05-26"
          tuva_last_updated: "2026-05-26"
          update_frequency: "ad hoc"
          notes: "Source of truth is the Tuva Conditions & Procedures Google Sheet."
      post_hook: "{{ load_versioned_seed('value_sets','tuva_condition_grouper_code_map.csv') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: tuva_condition_grouper_code_map
      tags:
        - value_sets
        - condition_grouper
      column_types:
        condition_family: *string
        condition: *string
        code: *string
        code_description: *text
        code_system: *string
        status: *string
        last_update_date: *date
        last_update_note: *text
    columns:
      - name: condition_family
        description: Analytic condition family assigned to the diagnosis code.
        tests:
          - not_null
      - name: condition
        description: Mutually exclusive Tuva condition assigned to the diagnosis code.
        tests:
          - not_null
      - name: code
        description: Diagnosis code mapped to the Tuva condition. ICD-10-CM codes are stored without decimal formatting.
        tests:
          - not_null
      - name: code_description
        description: Human-readable description for the mapped diagnosis code from the source terminology.
      - name: code_system
        description: Diagnosis code system for the mapped code. Current supported values are icd-10-cm and snomed-ct.
        tests:
          - not_null
      - name: status
        description: Status of the code mapping. Active mappings are available for current use; inactive mappings are retained for historical codes.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: last_update_date
        description: Date this code mapping row was last reviewed or updated.
      - name: last_update_note
        description: Short note describing the reason for the most recent update to the code mapping row.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_system
              - code
