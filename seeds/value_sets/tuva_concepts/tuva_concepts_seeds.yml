version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &string - short codes and identifiers
#   &text   - long free text
#   &date   - calendar date
anchors:
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(3000)
    {%- endif -%}
  - &date date

seeds:
  - name: value_sets__tuva_concepts
    description: |-
      Tuva Concepts defines reusable clinical and analytic concepts, such as conditions, therapies,
      diagnostic tests, and other code-based groupings. Each row represents one concept and can join to
      one or more Tuva Value Set Members on concept_id. The coding_system_id field identifies the coding
      system for the representative concept code and joins to Coding Systems. Tuva currently uses these
      tables in chronic condition models and other value-set-driven analytics.
    config:
      meta:
        primary_key_columns:
          - concept_id
        primary_key_strategy: natural_single_column
        data_asset:
          display_name: "Tuva Concepts"
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('value_sets','tuva_concepts.csv') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: tuva_concepts
      tags: value_sets
      column_types:
        concept_id: *string
        concept_name: *string
        status: *string
        concept_oid: *string
        last_update_date: *date
        last_update_note: *string
        concept_type: *string
        content_source: *text
        external_source_detail: *text
        concept_scope: *text
        value_set_search_notes: *text
        code: *string
        code_description: *string
        coding_system_id: *string
        coding_system_version: *string
    columns:
      - name: concept_id
        description: Primary key for the table. Joins to concept_id in Tuva Value Set Members.
      - name: concept_name
        description: Human-readable term for the concept. Should include spaces as needed, and casing per titlecase conventions, e.g. "Myocardial Infarction".
      - name: status
        description: Status of this concept and the completeness of the links to Tuva value set members. Values include "in progress", "ready for review", "reviewed", "inactive", others to be added as needed.
      - name: concept_oid
        description: OID for the concept; Added since some clinical concepts used in standardized quality measures have OIDs.
      - name: last_update_date
        description: Date of last update of this row (formatted as YYYY-MM-DD) and/or addition, removal, or changes to any of its linked value_set_members rows.
      - name: last_update_note
        description: Relevant details regarding the nature and reasons for the most recent update.
      - name: concept_type
        description: |
          Clinical type of the concept. Potential values: "condition", "therapy", "diagnostic test", others TBD.
      - name: content_source
        description: Indicates whether the clinical concept definition and associated value set content was developed by Tuva or from some other public source. Values will be "Tuva-developed" or "external".
      - name: external_source_detail
        description: For concepts for which the definition and associated value set content was not developed by Tuva, this provides details on the source of the concept.
      - name: concept_scope
        description: Narrative text that defines the semantic scope of the clinical concept, including specific inclusions and exclusions, to ensure consistency in value set construction and clarity in use. May be up to several paragraphs in length.
      - name: value_set_search_notes
        description: Narrative text that describes the approach taken for identifying candidate codes for human review. May include text search terms, code ranges or hierarchical assertions. Will facilitate consistency when periodic value set maintenance is performed.
      - name: code
        description: Standardized code that represents the concept, to facilitate searching for clinical concepts by standardized code. Not to be confused with value set member codes, this is meant to be synonymous with the concept or, if a synonymous code isn’t available, the closest subsuming code.
      - name: code_description
        description: Description for the code in concept_coding_code.
      - name: coding_system_id
        description: Coding system for the representative concept code in the code column. Joins to coding_system_id in Coding Systems.
      - name: coding_system_version
        description: Version of the coding system used. For now, editorial conventions and/or business logic will be required to establish a consistent format for coding version for each coding system.

  - name: value_sets__tuva_value_set_members
    description: |-
      Tuva Value Set Members lists the individual codes that belong to each Tuva concept. Each row
      represents one code included in a concept's value set. This table joins to Tuva Concepts on
      concept_id and to Coding Systems on coding_system_id, allowing downstream models to connect source
      codes to a named concept and the coding system that defines each code. Tuva currently uses these
      tables in chronic condition models and other value-set-driven analytics.
    config:
      meta:
        primary_key_columns:
          - value_set_member_id
        primary_key_strategy: natural_single_column
        data_asset:
          display_name: "Tuva Value Set Members"
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('value_sets','tuva_value_set_members.csv') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: tuva_value_set_members
      tags: value_sets
      column_types:
        value_set_member_id: *string
        concept_id: *string
        status: *string
        last_update_date: *date
        last_update_note: *string
        code: *string
        code_description: *text
        coding_system_id: *string
        coding_system_version: *string
        include_descendants: *string
        comment: *text
    columns:
      - name: value_set_member_id
        description: Primary key for the table
      - name: concept_id
        description: Foreign key to Tuva Concepts. Joins to concept_id in Tuva Concepts.
      - name: status
        description: Status of this individual Tuva value set member record. Options = "active" and "inactive", others to be added as needed.
      - name: last_update_date
        description: Date of last update of this row, formatted as YYYY-MM-DD.
      - name: last_update_note
        description: Relevant details regarding the nature and reasons for the most recent update.
      - name: code
        description: Standardized code that is a member of the value set for the concept referenced in concept_id
      - name: code_description
        description: Description for the code in the "code" column.
      - name: coding_system_id
        description: Coding system ID for the value set member code in the code column. Joins to coding_system_id in Coding Systems.
      - name: coding_system_version
        description: Version of the coding system used. For now, editorial conventions and/or business logic will be required to establish a consistent format for coding version for each coding system.
      - name: include_descendants
        description: Indicates whether the value set should include descendants of the specified code. If "true", include the specified code and all of its descendants. If "false", include only the specified code. Applies only to coding systems for which Tuva has implemented this feature.
      - name: comment
        description: In some cases it may be helpful to provide some explanatory context for inclusion of a particular code, e.g., insights into the intended meaning of the code that aren’t implicit in the code description but are implied by other aspects of the coding system e.g., ICD-10-CM coding guidance.

  - name: value_sets__coding_systems
    description: |-
      Coding Systems provides metadata for the coding systems referenced by Tuva Concepts and Tuva Value
      Set Members, including names, URIs, and OIDs. This table joins to both Tuva Concepts and Tuva Value
      Set Members on coding_system_id so downstream models can interpret which standard code system each
      concept code or value set member code belongs to. Tuva currently uses these tables in chronic
      condition models and other value-set-driven analytics.
    config:
      meta:
        primary_key_columns:
          - coding_system_id
        primary_key_strategy: natural_single_column
        data_asset:
          display_name: "Coding Systems"
          maintainer: "Tuva Health"
          source_url: "Tuva Health"
          source_release: ""
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "ad hoc"
      post_hook: "{{ load_versioned_seed('value_sets','coding_systems.csv') }}"
      schema: |
        {%- if  var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: coding_systems
      tags: value_sets
      column_types:
        coding_system_id: *string
        coding_system_name: *string
        coding_system_uri: *string
        coding_system_oid: *string
    columns:
      - name: coding_system_id
        description: Primary key for the table. Joins to coding_system_id in Tuva Concepts and Tuva Value Set Members.
      - name: coding_system_name
        description: Name of the coding system, e.g. "SNOMED CT US Edition"
      - name: coding_system_uri
        description: URI as used in FHIR to represent coding system. This provides an unambiguous identifier for the coding system.
      - name: coding_system_oid
        description: OID for the coding system. This provides another unambiguous identifier for the coding system (along with uri).
