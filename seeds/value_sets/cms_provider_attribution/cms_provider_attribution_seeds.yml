version: 2

# Column type vocabulary for this seed file. Every column_types entry uses one
# of these anchors so a warehouse type difference is fixed in exactly one place.
# Supported adapters: bigquery, snowflake, redshift, postgres, duckdb, athena,
# databricks, fabric.
#   &string  - short codes and identifiers
#   &text    - long free text
#   &integer - whole number
anchors:
  - &string |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(256)
    {%- endif -%}
  - &text |
    {%- if target.type in ("bigquery", "databricks") -%} string
    {%- else -%} varchar(3000)
    {%- endif -%}
  - &integer integer

seeds:
  - name: cms_provider_attribution__assignment_windows
    description: |-
      Assignment windows define the date ranges used by the Medicare Shared Savings Program attribution
      methodology. They are maintained by CMS in the Shared Savings and Losses and Assignment Methodology
      specifications. Tuva publishes this asset for CMS provider attribution methodology and user-led
      attribution review; current Tuva Core models do not join to it directly.
    config:
      meta:
        primary_key_columns:
          - performance_year
          - service_year
          - assignment_methodology
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "CMS Provider Attribution: Assignment Windows"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/medicare/medicare-fee-for-service-payment/sharedsavingsprogram/downloads/shared-savings-losses-assignment-spec-v7.pdf"
          source_release: "Shared Savings and Losses and Assignment Methodology v7"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution___assignment_windows.csv') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _assignment_windows
      tags: cms_provider_attribution
      enabled: "{{ var('provider_attribution_enabled', False) }}"
      column_types:
        performance_year: *string
        service_year: *string
        assignment_methodology: *string
        expanded_window_start: *string
        window_start: *string
        window_end: *string

  - name: cms_provider_attribution__primary_care_hcpcs_codes
    description: |-
      Primary care HCPCS codes identify services that count toward Medicare Shared Savings Program
      beneficiary assignment. They are maintained by CMS in the Shared Savings and Losses and Assignment
      Methodology specifications. Tuva uses this asset in provider attribution models.
    config:
      meta:
        data_asset:
          display_name: "CMS Provider Attribution: Primary Care HCPCS Codes"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/medicare/medicare-fee-for-service-payment/sharedsavingsprogram/downloads/shared-savings-losses-assignment-spec-v7.pdf"
          source_release: "Shared Savings and Losses and Assignment Methodology v7"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution___primary_care_hcpcs_codes.csv') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _primary_care_hcpcs_codes
      tags: cms_provider_attribution
      enabled: "{{ var('provider_attribution_enabled', False) }}"
      column_types:
        hcpcs_code: *string
        description: *text

        
  - name: cms_provider_attribution__provider_specialty_assignment_codes
    description: |-
      Provider specialty assignment codes identify specialties eligible to support Medicare Shared Savings
      Program beneficiary assignment. They are maintained by CMS in the Shared Savings and Losses and
      Assignment Methodology specifications. Tuva uses this asset in provider attribution models.
    config:
      meta:
        data_asset:
          display_name: "CMS Provider Attribution: Provider Specialty Assignment Codes"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/medicare/medicare-fee-for-service-payment/sharedsavingsprogram/downloads/shared-savings-losses-assignment-spec-v7.pdf"
          source_release: "Shared Savings and Losses and Assignment Methodology v7"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution___provider_specialty_assignment_codes.csv') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _provider_specialty_assignment_codes
      tags: cms_provider_attribution
      enabled: "{{ var('provider_attribution_enabled', False) }}"
      column_types:
        specialty_code: *string
        description: *text
        primary_care_physician_step1: *string
        specialist_physician_step_2: *string
        physician: *integer
