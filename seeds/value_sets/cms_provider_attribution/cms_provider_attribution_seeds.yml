version: 2

seeds:
  - name: cms_provider_attribution__assignment_windows
    description: |-
      Assignment windows define the date ranges used by the Medicare Shared Savings Program attribution
      methodology. They are maintained by CMS in the Shared Savings and Losses and Assignment Methodology
      specifications. Tuva publishes this asset for CMS provider attribution methodology and user-led
      attribution review; current Tuva Core models do not join to it directly.
    config:
      meta:
        primary_key_columns:
          - performance_year
          - service_year
          - assignment_methodology
        primary_key_strategy: natural_multi_column
        data_asset:
          display_name: "CMS Provider Attribution: Assignment Windows"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/files/document/medicare-shared-savings-program-shared-savings-losses-assignment-methodology-specifications-version.pdf-0"
          source_release: "Shared Savings and Losses, Assignment and Quality Performance Standard Methodology Specifications Version 14"
          source_last_updated: "2026-04-27"
          tuva_last_updated: "2026-08-26"
          update_frequency: "annually"
          notes: "Assignment windows are transcribed from Appendix B, Table 9, pages 88-89."
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution__assignment_windows.csv.gz') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _assignment_windows
      tags: cms_provider_attribution
      column_types:
        performance_year: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4) {%- endif -%}
        service_year: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4) {%- endif -%}
        assignment_methodology: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(32) {%- endif -%}
        expanded_window_start: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(32) {%- endif -%}
        window_start: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(32) {%- endif -%}
        window_end: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(32) {%- endif -%}
    columns:
      - name: performance_year
        description: Calendar year for which CMS performs beneficiary assignment.
        tests:
          - not_null
      - name: service_year
        description: Calendar year of claims included in the assignment window.
        tests:
          - not_null
      - name: assignment_methodology
        description: CMS beneficiary assignment methodology associated with the window.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prospective', 'retrospective']
      - name: expanded_window_start
        description: Start date of the expanded assignment window.
        tests:
          - not_null
      - name: window_start
        description: Start date of the standard assignment window.
        tests:
          - not_null
      - name: window_end
        description: End date of the standard assignment window.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - performance_year
              - service_year
              - assignment_methodology

  - name: cms_provider_attribution__primary_care_hcpcs_codes
    description: |-
      Primary care HCPCS codes identify services that count toward Medicare Shared Savings Program
      beneficiary assignment. They are maintained by CMS in the Shared Savings and Losses and Assignment
      Methodology specifications. Tuva uses this asset in provider attribution models.
    config:
      meta:
        data_asset:
          display_name: "CMS Provider Attribution: Primary Care HCPCS Codes"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/medicare/medicare-fee-for-service-payment/sharedsavingsprogram/downloads/shared-savings-losses-assignment-spec-v7.pdf"
          source_release: "Shared Savings and Losses and Assignment Methodology v7"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution__primary_care_hcpcs_codes.csv.gz') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _primary_care_hcpcs_codes
      tags: cms_provider_attribution
      column_types:
        hcpcs_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(5) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(512) {%- endif -%}

        
  - name: cms_provider_attribution__provider_specialty_assignment_codes
    description: |-
      Provider specialty assignment codes identify specialties eligible to support Medicare Shared Savings
      Program beneficiary assignment. They are maintained by CMS in the Shared Savings and Losses and
      Assignment Methodology specifications. Tuva uses this asset in provider attribution models.
    config:
      meta:
        data_asset:
          display_name: "CMS Provider Attribution: Provider Specialty Assignment Codes"
          maintainer: "CMS Shared Savings Program"
          source_url: "https://www.cms.gov/medicare/medicare-fee-for-service-payment/sharedsavingsprogram/downloads/shared-savings-losses-assignment-spec-v7.pdf"
          source_release: "Shared Savings and Losses and Assignment Methodology v7"
          source_last_updated: ""
          tuva_last_updated: "2026-03-30"
          update_frequency: "annually"
      post_hook: "{{ load_versioned_seed('value_sets','cms_provider_attribution__provider_specialty_assignment_codes.csv.gz') }}"
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _provider_specialty_assignment_codes
      tags: cms_provider_attribution
      column_types:
        specialty_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(8) {%- endif -%}
        description: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(512) {%- endif -%}
        primary_care_physician_step1: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4) {%- endif -%}
        specialist_physician_step_2: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(4) {%- endif -%}
        physician: integer
